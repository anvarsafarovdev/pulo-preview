  function tabs(){return '<div class="tabs" role="tablist"><button data-tab="owe" aria-pressed="'+(tab==='owe')+'">What I owe</button><button data-tab="paid" aria-pressed="'+(tab==='paid')+'">What I paid</button></div>'}
  function promo(){return '<button class="promo"><span class="pi">'+STORE+'</span><span class="pt"><b>Do people owe you money?</b><span>Keep track of it here. It’s free.</span></span><span class="pg">'+CHEV+'</span></button>'}

  function top(){return '<div class="top"><button class="ibtn" aria-label="Account">'+USER+'</button></div>'}
  function arrive(){return '<div class="scr"><span class="mk">'+MARK+'</span>'+OWL+
    '<h1 class="ar-h">BrickShop recorded a debt for you</h1>'+
    '<div class="card"><p class="k">The shop</p><p class="v">BrickShop</p><div class="sep"><p class="k">Debt for</p><p class="num">+998 •• ••• 63 38</p></div></div>'+
    '<div class="foot"><p class="agree">By tapping Yes, it’s me, you share <u>your number</u> and accept the <u>Terms</u>.</p>'+
    '<button class="btn pri" data-go="shop">Yes, it’s me</button><button class="btn ghost">No, not me</button></div></div>'}
  function paidList(){return '<p class="lab">Payments BrickShop confirmed</p>'+
    '<div class="debt paid"><p class="t">Cash</p><p class="r2">5 Nov</p><p class="amt">20 000<small>UZS</small></p><p class="ok">'+CHECK+'Confirmed by BrickShop</p></div>'+
    '<div class="debt paid"><p class="t">Cash</p><p class="r2">28 Oct</p><p class="amt">15 000<small>UZS</small></p><p class="ok">'+CHECK+'Confirmed by BrickShop</p></div>'}
  function shop(paid){
    var body = tab==='paid' ? paidList() :
      '<p class="shop">You owe<b>BrickShop</b></p>'+
      '<div class="owe"><p class="a">46 000<small>UZS</small></p><p class="d">Due in 3 days</p></div>'+
      '<p class="lab">What it’s for</p>'+
      '<div class="debt"><p class="t">3 bags of cement</p><p class="r2">12 Nov · due 19 Nov</p><p class="amt">46 000<small>UZS</small></p>'+
        (paid?'<p class="wait"><i></i>You said you paid. Waiting for BrickShop to confirm.</p>':'')+'</div>';
    var bar = tab==='paid' ? '' : (paid?'<div class="paybar"><button class="btn dis">Waiting for BrickShop to confirm</button></div>':'<div class="paybar"><button class="btn pri" data-go="paid">Pay</button></div>');
    return '<div class="scr dk">'+top()+(paid?'':'<p class="conn">'+CHECK+'<span>You’re connected to BrickShop.</span></p>')+tabs()+promo()+body+'</div>'+bar+dock('shop',paid?0:0)}
  function list(){
    var body = tab==='paid' ? '<p class="lab">Payments shops confirmed</p><div class="debt paid"><p class="t">BrickShop · Cash</p><p class="r2">5 Nov</p><p class="amt">20 000<small>UZS</small></p><p class="ok">'+CHECK+'Confirmed</p></div><div class="debt paid"><p class="t">Grapeshop · Card</p><p class="r2">1 Nov</p><p class="amt">50 000<small>UZS</small></p><p class="ok">'+CHECK+'Confirmed</p></div>' :
      '<div class="owe"><p class="k">You owe 2 shops</p><p class="a">146 000<small>UZS</small></p></div>'+
      '<div style="margin-top:var(--s3)">'+
      '<div class="row"><span class="bdg">BS</span><span class="n"><b>BrickShop</b><span>Due in 3 days</span><span class="amt2">46 000<small>UZS</small></span></span>'+CHEV+'</div>'+
      '<div class="row"><span class="bdg">GS</span><span class="n"><b>Grapeshop</b><span class="od">Overdue · 2 days</span><span class="amt2">100 000<small>UZS</small></span></span>'+CHEV+'</div></div>';
    return '<div class="scr dk">'+top()+tabs()+promo()+body+'</div>'+dock('list',2)}
  function none(){return '<div class="scr dk">'+top()+tabs()+promo()+
    '<div class="empty"><b>You owe nothing</b>When a shop records a debt for you, it shows here.</div></div>'+dock('list',0)}
  function updates(){return '<div class="scr dk">'+top()+'<h1 class="pgt">Updates</h1>'+
    '<div class="up"><span class="dot"></span><span class="tx"><b>Grapeshop didn’t confirm your payment</b><span>You said you paid 30 000 UZS. Talk to the shop, or tell Pulo it’s wrong.</span><em>Today, 10:12</em></span><button class="act">Open</button></div>'+
    '<div class="up"><span class="dot"></span><span class="tx"><b>Grapeshop recorded a new debt</b><span>100 000 UZS · due 14 Nov.</span><em>Yesterday</em></span><button class="act">Open</button></div>'+
    '<div class="up"><span class="dot seen"></span><span class="tx"><b>BrickShop confirmed your payment</b><span>20 000 UZS, 5 Nov.</span><em>5 Nov</em></span></div>'+
    '</div>'+dock('updates',2)}
  function draw(){
    root.innerHTML = s==='arrive'?arrive():s==='shop'?shop(false):s==='paid'?shop(true):s==='list'?list():s==='updates'?updates():none();
    [].forEach.call(document.querySelectorAll('#root [data-go]'),function(b){b.addEventListener('click',function(){s=b.dataset.go;tab='owe';draw();root.scrollTop=0})});
    [].forEach.call(root.querySelectorAll('[data-tab]'),function(b){b.addEventListener('click',function(){tab=b.dataset.tab;draw()})});
    [].forEach.call(document.querySelectorAll('.pv [data-s]'),function(b){b.setAttribute('aria-pressed',b.dataset.s===s?'true':'false')});
  }
  [].forEach.call(document.querySelectorAll('.pv [data-s]'),function(b){b.addEventListener('click',function(){s=b.dataset.s;tab='owe';draw()})});
  document.getElementById('th').addEventListener('click',function(){var r=document.documentElement;r.setAttribute('data-theme',r.getAttribute('data-theme')==='light'?'dark':'light')});
  document.getElementById('hide').addEventListener('click',function(){document.getElementById('pv').classList.add('hide')});
  document.getElementById('pvh').addEventListener('click',function(){document.getElementById('pv').classList.toggle('hide')});
  draw();
