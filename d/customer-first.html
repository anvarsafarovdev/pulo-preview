    var max=d?num(d.left)-pendSum(st.shop,d.id):num(S.total)-pendSum(st.shop);
    return '<div class="scrim" data-close></div><div class="sheet" role="dialog"><h2>Tell '+S.name+' you paid</h2>'+
      (d?'<p class="for">For: '+dTitle(d)+'</p>':'')+
      '<p class="fl">How much did you pay?</p><label class="in"><input id="amt" inputmode="numeric" data-max="'+max+'" value="'+fmt(max)+'"><span>UZS</span></label>'+
      '<button class="use" id="full">Use the full amount: '+fmt(max)+' UZS</button><p class="err" id="err" hidden>'+(d?'This debt has '+fmt(max)+' UZS left. You can’t enter more.':'You owe '+S.name+' '+fmt(max)+' UZS. You can’t enter more.')+'</p>'+
      '<p class="why">'+S.name+' confirms it, then your balance changes.</p>'+
      '<button class="btn pri" id="send">I paid this</button><button class="btn ghost" data-close>Not now</button></div>'}

  function debt(){var S=SHOPS[st.shop], d=debtOf(st.shop,st.debt)||S.debts[0], w=pendSum(st.shop,d.id);
    var went=PAYMENTS.filter(function(p){return p.shop===st.shop}).reduce(function(a,p){p.went.forEach(function(x){if(x.id===d.id)a.push({p:p,w:x})});return a},[]);
    var html='<div class="scr pb">'+topBack()+
      '<h1 class="dh one">'+(d.t||S.name)+'</h1><p class="ds">'+(d.t?S.name:'Debt of '+d.rec)+'</p>'+
      '<div class="owe" style="margin-top:var(--s5)"><p class="k">Left to pay</p><p class="a">'+d.left+'<small>UZS</small></p><p class="d">Due '+d.due+' · '+d.dueIn+'</p>'+
      (w?'<p class="pend"><i></i>'+fmt(w)+' UZS waiting for '+S.name+' to confirm</p>':'')+'</div>'+
      '<div class="facts"><p><span>Recorded</span><b>'+d.rec+'</b></p><p><span>Amount</span><b>'+d.orig+' UZS</b></p><p><span>Paid so far</span><b>'+d.paid+' UZS</b></p></div>';
    if(went.length){html+='<p class="lab">Payments that went to it</p>'+went.map(function(x){return '<button class="go" data-go="payment" data-pay="'+x.p.id+'"><span class="bx">'+amt(x.w.a,'g')+'<span class="r2">'+x.p.date+'</span></span><span class="pg">'+CHEV+'</span></button>'}).join('')}
    html+='</div><div class="paybar nodock">'+(w?'<button class="btn dis">Waiting for '+S.name+' to confirm</button>':'<button class="btn pri" data-sheet="'+d.id+'">Pay</button>')+'</div>';
    return html+(st.s==='debtsheet'?sheet():'')}

  function waitlist(){var S=SHOPS[st.shop], P=pending[st.shop]||[];
    return '<div class="scr">'+topBack()+'<h1 class="dh">Waiting for '+S.name+'</h1><p class="ds">'+plural(P.length)+' · '+fmt(pendSum(st.shop))+' UZS</p>'+
      '<div style="height:var(--s4)"></div>'+P.map(function(p){return pendCard(st.shop,p,false)}).join('')+'</div>'}

  function payment(){var p=PAYMENTS.filter(function(x){return x.id===st.pay})[0], S=SHOPS[p.shop];
    return '<div class="scr">'+topBack()+
      '<h1 class="dh">Payment to '+S.name+'</h1>'+
      '<div class="owe" style="margin-top:var(--s4)"><p class="a g">'+p.amt+'<small>UZS</small></p><p class="d">'+p.date+'</p><p class="ok">'+CHECK+p.how+'</p></div>'+
      '<p class="lab">Where it went</p>'+p.went.map(function(w){return '<div class="alloc"><span><b>'+w.t+'</b><span>'+w.d+'</span></span><span class="r"><b>'+w.a+' UZS</b><span>'+w.s+'</span></span></div>'}).join('')+
      '</div>'}

  function list(){var body;
    if(st.tab==='paid'){
      body='<div style="height:var(--s4)"></div>'+['bs','gs'].map(function(k){return (pending[k]||[]).map(function(p){return pendCard(k,p,true)}).join('')}).join('')+PAYMENTS.map(function(x){return payCard(x,true)}).join('');
    } else {
      body='<div class="owe" style="margin-top:var(--s5)"><p class="k">You owe 2 shops</p><p class="a">176 000<small>UZS</small></p></div><div style="margin-top:var(--s3)">'+
        ['bs','gs'].map(function(k){var S=SHOPS[k], n=(pending[k]||[]).length;return '<button class="row" data-go="shop" data-shop="'+k+'"><span class="bdg">'+S.ini+'</span><span class="n"><b>'+S.name+'</b><span>'+S.due+'</span>'+
          (n?'<span class="wt"><i></i>'+plural(n)+' waiting to confirm</span>':'')+'<span class="amt">'+S.total+'<small>UZS</small></span></span>'+CHEV+'</button>'}).join('')+'</div>';
    }
    return '<div class="scr dk">'+topAcc()+seg()+promo()+body+'</div>'+dock('home')}

  function none(){return '<div class="scr dk">'+topAcc()+seg()+promo()+
    '<div class="empty"><b>You owe nothing</b>When a shop records a debt for you, it shows here.</div></div>'+dock('home')}

  function updates(){
    return '<div class="scr dk">'+topAcc()+'<h1 class="pgt">Updates</h1>'+NOTES.map(function(n){var u=unread[n.id];
      return '<'+(n.act?'button':'div')+' class="up'+(n.act?' act':'')+(u?'':' read')+'"'+(n.act?' data-note="'+n.id+'"':'')+'>'+
        '<span class="dot'+(u?'':' seen')+'"></span><span class="tx"><b>'+n.b+'</b><span>'+n.s+'</span><em>'+n.w+'</em></span>'+(n.act?CHEV:'')+'</'+(n.act?'button':'div')+'>'}).join('')+
      '</div>'+dock('updates')}

  /* ── navigation ─────────────────────────────────────────────── */
  var hist=[];
  function go(next,push){
    if(st.s==='updates' && next.s!=='updates' && seenInfo){NOTES.forEach(function(n){if(!n.act)unread[n.id]=0});seenInfo=false}
    if(push!==false)hist.push(JSON.parse(JSON.stringify(st)));
    for(var k in next)st[k]=next[k];
    if(next.s && next.tab===undefined)st.tab='owe';
    if(st.s==='updates')seenInfo=true;
    draw(); root.scrollTop=0;
  }
  function draw(){
    var s=st.s, html;
    if(s==='arrive')html=arrive();
    else if(s==='shop'||s==='sheet')html=shop()+(s==='sheet'?sheet():'');
    else if(s==='debt'||s==='debtsheet')html=debt();
    else if(s==='waitlist')html=waitlist();
    else if(s==='payment')html=payment();
    else if(s==='list')html=list();
    else if(s==='updates')html=updates();
    else html=none();
    root.innerHTML=html;
    [].forEach.call(root.querySelectorAll('[data-go]'),function(b){b.addEventListener('click',function(){
      var g=b.dataset.go, n={s:g};
      if(g==='home'){n.s=st.home||'shop';n.shop='bs'}
      if(b.dataset.shop)n.shop=b.dataset.shop;
      if(b.dataset.debt)n.debt=b.dataset.debt;
      if(b.dataset.pay)n.pay=b.dataset.pay;
      n.first=!!b.dataset.first;
      go(n)})});
    [].forEach.call(root.querySelectorAll('[data-tab]'),function(b){b.addEventListener('click',function(){st.tab=b.dataset.tab;draw()})});
    [].forEach.call(root.querySelectorAll('[data-note]'),function(b){b.addEventListener('click',function(){
      var n=NOTES.filter(function(x){return x.id===b.dataset.note})[0]; unread[n.id]=0;
      var nx=JSON.parse(JSON.stringify(n.go)); go(nx)})});
    [].forEach.call(root.querySelectorAll('[data-back]'),function(b){b.addEventListener('click',function(){var p=hist.pop();if(p){st=p;draw()}})});
    [].forEach.call(root.querySelectorAll('[data-sheet]'),function(b){b.addEventListener('click',function(){st.sheetDebt=b.dataset.sheet||null;st.s=st.s==='debt'?'debtsheet':'sheet';draw()})});
    [].forEach.call(root.querySelectorAll('[data-close]'),function(b){b.addEventListener('click',function(){st.s=st.s==='debtsheet'?'debt':'shop';draw()})});
    var inp=document.getElementById('amt');
    if(inp){var max=num(inp.dataset.max);
      function check(){var v=num(inp.value);inp.value=v?fmt(v):'';var over=v>max;
        document.getElementById('err').hidden=!over;var sb=document.getElementById('send');sb.disabled=over||!v;sb.className='btn '+((over||!v)?'dis':'pri');}
      inp.addEventListener('input',check);
      document.getElementById('full').addEventListener('click',function(){inp.value=fmt(max);check()});
      document.getElementById('send').addEventListener('click',function(){if(this.disabled)return;
        (pending[st.shop]=pending[st.shop]||[]).push({amt:inp.value,debt:st.sheetDebt||null});
        st.s=st.s==='debtsheet'?'debt':'shop';st.first=false;draw()});
    }
    [].forEach.call(document.querySelectorAll('.pv [data-s]'),function(b){b.setAttribute('aria-pressed',b.dataset.s===st.s?'true':'false')});
  }
  [].forEach.call(document.querySelectorAll('.pv [data-s]'),function(b){b.addEventListener('click',function(){
    var s=b.dataset.s, n={s:s,tab:'owe',first:false};
    if(s==='shop'){n.shop='bs';n.first=true;st.home='shop';pending.bs=[]}
    if(s==='sheet'){n.shop='bs';n.sheetDebt=null;pending.bs=[];st.home='shop'}
    if(s==='waiting'){n.s='shop';n.shop='bs';st.home='shop';pending.bs=[{amt:'10 000',debt:'glue'},{amt:'20 000',debt:'cement'},{amt:'5 000',debt:null}]}
    if(s==='debt'){n.shop='bs';n.debt='glue';pending.bs=[]}
    if(s==='debtnn'){n.s='debt';n.shop='bs';n.debt='cement';pending.bs=[]}
    if(s==='waitlist'){n.shop='bs';pending.bs=[{amt:'10 000',debt:'glue'},{amt:'20 000',debt:'cement'},{amt:'5 000',debt:null}]}
    if(s==='payment')n.pay='p1';
    if(s==='list')st.home='list';
    hist=[];go(n,false)})});
  document.getElementById('reset').addEventListener('click',function(){fresh();hist=[];draw()});
  document.getElementById('th').addEventListener('click',function(){var r=document.documentElement;r.setAttribute('data-theme',r.getAttribute('data-theme')==='light'?'dark':'light')});
  document.getElementById('hide').addEventListener('click',function(){document.getElementById('pv').classList.add('hide')});
  document.getElementById('pvh').addEventListener('click',function(){document.getElementById('pv').classList.toggle('hide')});
  draw();
  window.addEventListener('load',function(){ if(window.PT){PT.main(null);} var T=window.Telegram&&Telegram.WebApp;
    if(T&&T.platform&&T.platform!=='unknown'){var a=T.safeAreaInset||{},c=T.contentSafeAreaInset||{};
      document.documentElement.style.setProperty('--pulo-layout-inset-top',((a.top||0)+(c.top||0))+'px');
      document.documentElement.style.setProperty('--pulo-layout-inset-bottom',((a.bottom||0)+(c.bottom||0))+'px');}});
})();
</script>
