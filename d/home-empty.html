<style>
#root{position:fixed;inset:0;overflow:hidden;padding-top:var(--pulo-layout-inset-top,0px);background:var(--ground);color:var(--text-1)}
.hd{display:flex;align-items:center;gap:10px;padding:var(--s4) var(--gut) 0}
.hd b{flex:1;font-size:var(--t-5);font-weight:600}
.rb{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.rb svg{width:20px;height:20px;fill:none;stroke:var(--text-2);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.find{display:flex;gap:10px;padding:var(--s3) var(--gut) 0}
.find .f{flex:1;height:52px;border-radius:var(--r-1);background:var(--surface);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--text-3);font-size:var(--t-4)}
.find .f svg,.find .s svg{width:20px;height:20px;fill:none;stroke:var(--text-2);stroke-width:1.8;stroke-linecap:round}
.find .s{width:52px;height:52px;border-radius:var(--r-1);background:var(--surface);display:grid;place-items:center}
.chips{display:flex;gap:10px;padding:var(--s4) var(--gut) 0;overflow:hidden;white-space:nowrap}
.chips span{padding:12px 18px;border-radius:var(--r-1);background:var(--surface);color:var(--text-2);font-size:var(--t-3);display:inline-flex;align-items:center;gap:8px}
.chips span:first-child{color:var(--text-1)}
.chips svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.parties{display:flex;justify-content:space-between;padding:var(--s5) var(--gut) 0;color:var(--text-2);font-size:var(--t-3)}
/* the empty state: icon + one line, centred on the SCREEN, not on the space left */
.first{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;pointer-events:none}
.first svg{width:30px;height:30px;fill:none;stroke:var(--text-2);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.first p{margin:var(--s4) 0 0;font-size:var(--t-4);font-weight:700;letter-spacing:-.015em;color:var(--text-1)}
/* the dock: the app's own (.hm-dock / .hm-tab) */
.hm-dock{position:fixed}
.hm-tab svg.f{fill:currentColor}
/* the pointer: floats above Record and bobs gently */
.ptr{position:fixed;left:50%;bottom:calc(var(--pulo-layout-inset-bottom,0px) + 10px + 62px + 6px);width:28px;height:44px;margin-left:-14px;color:var(--text-2);animation:bob 1.6s ease-in-out infinite;pointer-events:none}
.ptr svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ptr.b svg{display:none}.ptr.b .ch{display:flex}
.ptr .ch{display:none;flex-direction:column;align-items:center;gap:0}
.ptr .ch i{display:block;width:12px;height:12px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-top:-3px;animation:fade 1.6s ease-in-out infinite}
.ptr .ch i:nth-child(1){animation-delay:0s}.ptr .ch i:nth-child(2){animation-delay:.2s}.ptr .ch i:nth-child(3){animation-delay:.4s}
@keyframes bob{0%,100%{transform:translateY(-6px)}50%{transform:translateY(2px)}}
@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.ptr,.ptr .ch i{animation:none}}
/* preview chrome */
.pv{position:fixed;left:8px;right:8px;top:calc(var(--pulo-layout-inset-top,0px) + 34px);z-index:50;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font:600 11px/1 system-ui,sans-serif}
.pv button{padding:7px 10px;border-radius:999px;border:1px solid rgba(128,128,128,.35);background:rgba(128,128,128,.14);color:var(--text-2);font:inherit;cursor:pointer}
.pv button[aria-pressed="true"]{background:var(--text-1);color:var(--ground)}
.pv.hide{display:none}
.pvh{position:fixed;top:calc(var(--pulo-layout-inset-top,0px) + 6px);left:50%;transform:translateX(-50%);z-index:51;width:34px;height:22px;border-radius:999px;border:0;background:rgba(128,128,128,.12);color:var(--text-3);font:700 12px/1 system-ui;opacity:.55}
.tag{position:fixed;right:8px;top:calc(var(--pulo-layout-inset-top,0px) + 8px);z-index:51;font:700 10px/1 system-ui;letter-spacing:.04em;color:#3fae6a}
</style>
</head>

<script>
(function(){
  var ptr=document.getElementById('ptr');
  function place(){var r=document.querySelector('[data-seat=create] .puck').getBoundingClientRect();ptr.style.left=(r.left+r.width/2)+'px'}
  place();window.addEventListener('resize',place);setTimeout(place,300);
  [].forEach.call(document.querySelectorAll('.pv [data-p]'),function(b){b.addEventListener('click',function(){
    ptr.className='ptr'+(b.dataset.p==='b'?' b':'');
    [].forEach.call(document.querySelectorAll('.pv [data-p]'),function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});})});
  document.getElementById('th').addEventListener('click',function(){var r=document.documentElement;r.setAttribute('data-theme',r.getAttribute('data-theme')==='light'?'dark':'light')});
  document.getElementById('hide').addEventListener('click',function(){document.getElementById('pv').classList.add('hide')});
  document.getElementById('pvh').addEventListener('click',function(){document.getElementById('pv').classList.toggle('hide')});
  window.addEventListener('load',function(){ if(window.PT){PT.main(null);} var T=window.Telegram&&Telegram.WebApp;
    if(T&&T.platform&&T.platform!=='unknown'){var a=T.safeAreaInset||{},c=T.contentSafeAreaInset||{};
      document.documentElement.style.setProperty('--pulo-layout-inset-top',((a.top||0)+(c.top||0))+'px');
      document.documentElement.style.setProperty('--pulo-layout-inset-bottom',((a.bottom||0)+(c.bottom||0))+'px');}});
})();
</script>
