<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Send the invite (in the app) r1</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="../fonts/pulo-round.css?v=202611152130">
<link rel="stylesheet" href="../appcss/app-full.css?v=202611152130">
<style>
/* ══ THE INVITE PAGE (inside the app). Shown after "Save and invite", in place of the Done page,
      only for a first contact. Tokens and type roles are the app's own; nothing new. ══ */
.iv{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--ground);color:var(--text-1);
  padding-top:var(--pulo-layout-inset-top,0px);animation:ivIn 260ms var(--ease-out) both}
@keyframes ivIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.iv-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 var(--s6)}

/* the hero: a message bubble that is "typing", inside a soft halo that breathes */
.iv-hero{position:relative;width:112px;height:112px;display:grid;place-items:center;margin-bottom:var(--s3)}
.iv-halo{position:absolute;inset:0;border-radius:50%;background:var(--in);opacity:.10}
.iv-halo.b{animation:ivHalo 2.6s var(--ease-out) infinite}
.iv-halo.a{transform:scale(.78);opacity:.16}
@keyframes ivHalo{0%{transform:scale(.78);opacity:.22}70%{transform:scale(1.08);opacity:0}100%{transform:scale(1.08);opacity:0}}
.iv-bub{position:relative;width:104px;height:104px;animation:ivPop 520ms var(--ease-done-pop) 120ms both,ivFloat 3.2s ease-in-out 700ms infinite}
@keyframes ivFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes ivPop{from{transform:scale(.6) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.iv-bub path{fill:var(--raised);stroke:none}
.iv-bub circle{fill:var(--text-1);animation:ivDot 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.iv-bub circle:nth-child(3){animation-delay:.2s}.iv-bub circle:nth-child(4){animation-delay:.4s}
@keyframes ivDot{0%,70%,100%{transform:scale(.72);opacity:.3}30%{transform:scale(1.18);opacity:1}}
/* after the tap: the bubble lifts off, a tick takes its place */
.iv[data-state="sent"] .iv-bub{animation:ivFly 620ms var(--ease-done-fly) both}
@keyframes ivFly{0%{transform:none;opacity:1}100%{transform:translate(46px,-60px) rotate(-14deg) scale(.5);opacity:0}}
.iv-tick{position:absolute;width:64px;height:64px;opacity:0}
.iv-tick path{fill:none;stroke:var(--in);stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60}
.iv[data-state="sent"] .iv-tick{opacity:1}
.iv[data-state="sent"] .iv-tick path{animation:ivT 420ms var(--ease-out) 380ms forwards}
@keyframes ivT{to{stroke-dashoffset:0}}
.iv[data-state="offline"] .iv-bub circle{animation:none;opacity:.35}
.iv[data-state="offline"] .iv-bub{animation:none}

/* the receipt line: the debt is already saved, whatever happens next */
.iv-chip{display:inline-flex;align-items:center;gap:6px;margin:0 0 var(--s4);padding:6px 12px 6px 9px;border-radius:var(--r-pill);
  background:var(--surface);font-size:var(--t-2);font-weight:600;color:var(--text-2)}
.iv-chip svg{width:16px;height:16px;fill:none;stroke:var(--in);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.iv-chip b{color:var(--text-1);font-weight:700;font-variant-numeric:tabular-nums}
.iv-title{margin:0;font-size:var(--t-6);font-weight:700;line-height:1.5;letter-spacing:-.01em}
.iv-body span{display:block}
.iv-body{margin:var(--s2) 0 0;max-width:21rem;font-size:var(--t-3);line-height:1.5;color:var(--text-2)}

.iv-foot{padding:0 var(--gut) calc(var(--s5) + var(--pulo-layout-inset-bottom,0px) + env(safe-area-inset-bottom,0px));display:grid;gap:var(--s2)}
.iv-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:var(--r-1);
  background:var(--text-1);color:var(--ground);font:inherit;font-size:var(--t-4);font-weight:700;cursor:pointer;
  transition:transform 120ms var(--ease-out)}
.iv-btn:active{transform:scale(.98)}
.iv-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iv-btn[aria-busy="true"]{cursor:default}
.iv-btn .ring{width:22px;height:22px;stroke-dasharray:14 43;animation:ivSpin 900ms linear infinite;transform-origin:50% 50%}
@keyframes ivSpin{to{transform:rotate(360deg)}}
.iv-later{min-height:48px;border:0;background:none;color:var(--text-2);font:inherit;font-size:var(--t-3);font-weight:600;cursor:pointer}
@media (prefers-reduced-motion: reduce){.iv,.iv-bub,.iv-bub circle{animation:none!important}.iv-bub circle{opacity:1}}
[data-motion="reduced"] .iv-bub,[data-motion="reduced"] .iv-bub circle{animation:none}

/* preview-only controls */
.pv{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  font:600 11px/1 system-ui,sans-serif}
.pv button{padding:7px 10px;border-radius:999px;border:1px solid rgba(128,128,128,.35);background:rgba(128,128,128,.14);color:var(--text-2);font:inherit}
.pv button[aria-pressed="true"]{background:var(--text-1);color:var(--ground)}
.pv.hide{display:none}
.pvh{position:fixed;top:calc(var(--pulo-layout-inset-top,0px) + 6px);left:6px;z-index:51;width:34px;height:22px;border-radius:999px;border:0;background:rgba(128,128,128,.12);color:var(--text-3);font:700 12px/1 system-ui;opacity:.55}
.pv{bottom:auto;top:calc(var(--pulo-layout-inset-top,0px) + 34px)}
</style>
</head>
<body>
<div class="pulo-app" id="root">
<div class="iv" id="iv" data-state="ready" role="main">
  <div class="iv-mid">
    <div class="iv-hero" aria-hidden="true">
            <svg class="iv-bub" viewBox="0 0 96 96">
        <path d="M30 18h36a20 20 0 0 1 20 20v10a20 20 0 0 1-20 20H42l-13.6 11.4a2 2 0 0 1-3.3-1.7l1.6-10A20 20 0 0 1 10 48V38a20 20 0 0 1 20-20z"/>
        <circle cx="34" cy="43" r="4.6"/><circle cx="48" cy="43" r="4.6"/><circle cx="62" cy="43" r="4.6"/>
      </svg>
      <svg class="iv-tick" viewBox="0 0 64 64"><path d="M16 33l10.5 10.5L48 22"/></svg>
    </div>
    <p class="iv-chip"><svg viewBox="0 0 16 16"><path d="M3.5 8.4l2.9 2.9 6.1-6.6"/></svg><span>Debt saved</span><span aria-hidden="true">·</span><b>34 000 UZS</b></p>
    <h1 class="iv-title" id="t"></h1>
    <p class="iv-body" id="p"></p>
  </div>
  <div class="iv-foot">
    <button class="iv-btn" id="go" type="button"></button>
    
  </div>
</div>
</div>
<button class="pvh" id="pvh" type="button" aria-label="Preview states">···</button>
<div class="pv hide" id="pv">
  <button data-s="ready" aria-pressed="true">Ready</button>
  <button data-s="busy">Getting ready</button>
  <button data-s="sent">After the tap</button>
  <button data-s="offline">Offline</button>
  <button data-n="1" id="nm">Name: Aziz</button>
  <button id="th">Theme</button>
  <button id="hide">Hide</button>
</div>
<script>
(function(){
  var iv=document.getElementById('iv'),t=document.getElementById('t'),p=document.getElementById('p'),go=document.getElementById('go');
  var SMS='<svg viewBox="0 0 24 24"><path d="M7 5h10a4 4 0 0 1 4 4v4a4 4 0 0 1-4 4h-6l-4 3.4V17a4 4 0 0 1-3-3.9V9a4 4 0 0 1 4-4z"/><path d="M9 11h.01M12 11h.01M15 11h.01"/></svg>';
  var RING='<svg class="ring" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>';
  var name='Aziz', state='ready';
  /* PROVISIONAL ENGLISH: every sentence here waits for the language pass. */
  function words(){
    var who=name?name:'them';
    var W={
      ready:  {t: name?'Send '+name+' the invite':'Send the invite', p:['They are not on Pulo yet.','One SMS from you lets them see this debt and connect.'], b:SMS+'<span>Send SMS now</span>', l:'Later, from Home'},
      busy:   {t: name?'Send '+name+' the invite':'Send the invite', p:['They are not on Pulo yet.','One SMS from you lets them see this debt and connect.'], b:RING+'<span>Getting it ready</span>', l:'Later, from Home'},
      sent:   {t:'Your SMS app is open', p:['Press Send there.','Pulo shows '+(name?name:'them')+' as connected once they tap the link.'], b:SMS+'<span>Open it again</span>', l:''},
      offline:{t:'Invite when you are online', p:['The debt is saved.','When you are back online, tap Invite next to '+(name?name:'this contact')+' on Home.'], b:'<span>Back to Home</span>', l:''}
    }[state];
    t.textContent=W.t; p.innerHTML=''; W.p.forEach(function(x){var e=document.createElement('span');e.textContent=x;p.appendChild(e)}); go.innerHTML=W.b;
    go.setAttribute('aria-busy',state==='busy'?'true':'false');
  }
  function setState(s){state=s;iv.setAttribute('data-state',s);
    [].forEach.call(document.querySelectorAll('.pv [data-s]'),function(b){b.setAttribute('aria-pressed',b.dataset.s===s?'true':'false')});
    if(s==='sent'){var h=iv.querySelector('.iv-hero');var c=h.cloneNode(true);h.parentNode.replaceChild(c,h);} /* replay */
    words();}
  go.addEventListener('click',function(){ if(state==='ready'){setState('busy');setTimeout(function(){setState('sent')},900)} else if(state==='sent'){setState('sent')} });
  [].forEach.call(document.querySelectorAll('.pv [data-s]'),function(b){b.addEventListener('click',function(){setState(b.dataset.s)})});
  document.getElementById('nm').addEventListener('click',function(){name=name?'':'Aziz';this.textContent=name?'Name: Aziz':'No name';words()});
  document.getElementById('th').addEventListener('click',function(){var r=document.documentElement;r.setAttribute('data-theme',r.getAttribute('data-theme')==='light'?'dark':'light')});
  document.getElementById('hide').addEventListener('click',function(){document.getElementById('pv').classList.add('hide')});document.getElementById('pvh').addEventListener('click',function(){document.getElementById('pv').classList.toggle('hide')});
  words();
  window.addEventListener('load',function(){ if(window.PT){PT.main(null);} var W=window.Telegram&&Telegram.WebApp;
    if(W&&W.platform&&W.platform!=='unknown'){var a=W.safeAreaInset||{},c=W.contentSafeAreaInset||{};
      document.documentElement.style.setProperty('--pulo-layout-inset-top',((a.top||0)+(c.top||0))+'px');
      document.documentElement.style.setProperty('--pulo-layout-inset-bottom',((a.bottom||0)+(c.bottom||0))+'px');}});
})();
</script>
<script src="../tg.js?v=202611152130"></script>
</body>
</html>
