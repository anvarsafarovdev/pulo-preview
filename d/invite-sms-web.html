<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F4F5F6">
<title>Pulo</title>
<link rel="stylesheet" href="../fonts/pulo-round.css?v=202611161238">
<style>
/* ══ THE BROWSER PAGE (www.pulo.uz/s/…), r2 after the founder's marks of 15 Nov:
      the wordmark centred in the middle; the debt's own numbers large in Pulo Round; no title, no lede,
      no message preview, no "Message not sent yet", no "opens your SMS app", no "Invite stays";
      "This page works for one hour" kept. ══ */
:root{color-scheme:only light;--bg:#F4F5F6;--card:#FFFFFF;--line:#E4E6E9;--ink:#1B1D20;--ink-2:#5F6368;--ink-3:#80858B;
  --green:#007036;--green-soft:#E6F2EB;--btn:#1B1D20;--btn-ink:#FFFFFF}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);
  font:16px/1.5 'Pulo Round',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:28rem;min-height:100vh;min-height:100dvh;margin:0 auto;display:flex;flex-direction:column;align-items:center;
  padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(18px + env(safe-area-inset-bottom,0px));text-align:center}
.grow{flex:1 1 0;min-height:16px}
.grow.b{flex-grow:1}

.wm{display:block;width:96px;height:auto;color:var(--ink)}
.shop{margin:12px 0 0;font-size:.86rem;font-weight:600;color:var(--ink-3)}

.card{width:100%;margin:18px 0 0;container-type:inline-size;padding:24px 20px 22px;background:var(--card);border:1px solid var(--line);border-radius:22px;
  box-shadow:0 1px 2px rgba(27,29,32,.04),0 10px 30px rgba(27,29,32,.05)}
.step{display:inline-flex;align-items:center;gap:7px;padding:4px 11px 4px 9px;border-radius:999px;background:var(--green-soft);color:var(--green);font-size:.76rem;font-weight:700}
.step i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(0,112,54,.18)}
.lbl{display:block;margin:16px 0 0;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);line-height:1.5}
.amt{display:block;margin:2px 0 0;font-size:min(3rem,calc((100cqi - 8px) / (var(--n,6) * .64 + 1.5)));font-weight:700;line-height:1.5;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.amt em{font-style:normal;font-size:max(.36em,13px);font-weight:700;letter-spacing:.04em;color:var(--ink-2);margin-left:.3em}
.rule{height:1px;margin:14px auto 0;width:64%;background:var(--line)}
.when{display:block;margin:2px 0 0;font-size:1.5rem;font-weight:700;line-height:1.5;font-variant-numeric:tabular-nums}
.sub{display:block;font-size:.88rem;color:var(--ink-2);line-height:1.5}
.to{margin:16px 0 0;font-size:.84rem;color:var(--ink-2);line-height:1.5}
.to b{color:var(--ink);font-weight:700}
.to span{white-space:nowrap;font-variant-numeric:tabular-nums}

.cta{width:100%}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:14px;background:var(--btn);color:var(--btn-ink);
  font:inherit;font-weight:700;font-size:1.04rem;text-decoration:none;box-shadow:0 6px 18px rgba(27,29,32,.18)}
.btn:active{transform:scale(.985)}
.btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pc{margin:0;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--ink-2);font-size:.92rem}
.fine{margin:0 0 10px;color:var(--ink-3);font-size:.8rem;line-height:1.5}

.gone .ic{display:grid;place-items:center;width:64px;height:64px;margin:28px auto 0;border-radius:50%;background:var(--card);border:1px solid var(--line)}
.gone .ic svg{width:28px;height:28px;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.gone h1{margin:14px 0 0;font-size:1.3rem;line-height:1.5}
.gone p{margin:4px auto 0;max-width:19rem;color:var(--ink-2);font-size:.95rem}
@media (max-width:359px){.wrap{padding-left:16px;padding-right:16px}.when{font-size:1.3rem}.wm{width:84px}}
@media (max-height:640px){.card{padding:18px 18px 16px}}

/* preview-only controls, tucked away */
.pvh{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));left:6px;z-index:51;width:34px;height:22px;border-radius:999px;border:0;background:rgba(0,0,0,.05);color:#999;font:700 12px/1 system-ui;opacity:.7}
.pv{position:fixed;top:calc(34px + env(safe-area-inset-top,0px));left:6px;right:6px;z-index:50;display:flex;flex-wrap:wrap;justify-content:center;gap:4px;font:600 10px/1 system-ui,sans-serif}
.pv.hide{display:none}
.pv button{padding:6px 8px;border-radius:999px;border:1px solid #cfd3d8;background:#fff;color:#444;font:inherit}
.pv button[aria-pressed="true"]{background:#1B1D20;color:#fff;border-color:#1B1D20}
[hidden]{display:none!important}
</style>
</head>
<body>
<button class="pvh" id="pvh" type="button" aria-label="Preview states">···</button>
<div class="pv hide" id="pv">
  <button data-v="phone" aria-pressed="true">Phone</button><button data-v="pc">Computer</button><button data-v="gone">Expired</button>
  <button data-k="due" aria-pressed="true">Due date</button><button data-k="rep">Repeats</button><button data-k="ins">Installments</button><button data-k="none">No date</button>
  <button data-a="34 000|UZS" aria-pressed="true">34 000</button><button data-a="1 250 000|UZS">1 250 000</button><button data-a="125 000 000|UZS">125 000 000</button><button data-a="2 500 000 000|UZS">2 500 000 000</button><button data-a="1 250.50|USD">1 250.50 USD</button>
</div>

<main class="wrap">
  <div class="grow"></div>

366 135.51 137.399 166.2 137.399Z"/></svg>

  <section class="card" data-for="live">
    <span class="step"><i></i>Last step</span>
    <span class="lbl">Debt</span>
    <b class="amt" id="amt" style="--n:6"><span id="af">34 000</span><em id="ac">UZS</em></b>
    <div id="sched">
      <div class="rule"></div>
      <span class="lbl" id="sl">Due</span>
      <b class="when" id="sw">16 Nov 2026</b>
      <span class="sub" id="ss" hidden></span>
    </div>
    <p class="to">to <b>Aziz Karimov</b> · <span>+998 90 123 45 67</span></p>
  </section>

  <section class="gone" data-for="gone" hidden>
    <span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>
    <h1>This page has expired</h1>
    <p>The debt is safe in Pulo. Open Pulo and tap Invite to get a new page.</p>
  </section>

  <div class="grow b"></div>
  <div class="cta" data-for="live">
    <p class="fine">This page works for one hour.</p>
    <a class="btn" data-for="phone" href="sms:+998901234567?&body=preview"><svg viewBox="0 0 24 24"><path d="M7 5h10a4 4 0 0 1 4 4v4a4 4 0 0 1-4 4h-6l-4 3.4V17a4 4 0 0 1-3-3.9V9a4 4 0 0 1 4-4z"/><path d="M9 11h.01M12 11h.01M15 11h.01"/></svg>Open Messages</a>
    <p class="pc" data-for="pc" hidden>Open this link on your phone to send the SMS.</p>
  </div>
</main>
<script>
(function(){
  var view='phone';
  function show(v){view=v;
    document.querySelectorAll('.pv [data-v]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.v===v?'true':'false')});
    document.querySelectorAll('[data-for]').forEach(function(el){var f=el.getAttribute('data-for');
      el.hidden=!((f==='live'&&v!=='gone')||(f==='gone'&&v==='gone')||(f==='phone'&&v==='phone')||(f==='pc'&&v==='pc'));});
  }
  var K={due:['Due','16 Nov 2026',''],rep:['Repeats','Every month','On the 1st, until it is paid'],ins:['Installments','6 × 5 667 UZS','Every Saturday, until 21 Dec 2026'],none:null};
  function kind(k){document.querySelectorAll('.pv [data-k]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.k===k?'true':'false')});
    var d=K[k],s=document.getElementById('sched');s.hidden=!d;if(!d)return;
    document.getElementById('sl').textContent=d[0];document.getElementById('sw').textContent=d[1];
    var ss=document.getElementById('ss');ss.textContent=d[2];ss.hidden=!d[2];}
  document.querySelectorAll('.pv [data-v]').forEach(function(b){b.addEventListener('click',function(){show(b.dataset.v)})});
  document.querySelectorAll('.pv [data-k]').forEach(function(b){b.addEventListener('click',function(){kind(b.dataset.k)})});
  document.getElementById('pvh').addEventListener('click',function(){document.getElementById('pv').classList.toggle('hide')});
  var f=document.querySelector('.fine'),keep=f.textContent;
  document.querySelector('.btn').addEventListener('click',function(e){e.preventDefault();f.textContent='Preview: Messages would open here, filled in.';setTimeout(function(){f.textContent=keep},2200)});
  function amt(v){var a=v.split('|');document.getElementById('af').textContent=a[0];document.getElementById('ac').textContent=a[1];
    document.getElementById('amt').style.setProperty('--n',a[0].length);
    document.querySelectorAll('.pv [data-a]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.a===v?'true':'false')});}
  document.querySelectorAll('.pv [data-a]').forEach(function(b){b.addEventListener('click',function(){amt(b.dataset.a)})});
  show('phone');kind('due');
})();
</script>
