<style>
#root{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--pulo-layout-inset-top,0px);background:var(--ground)}
#root>div{flex:1;display:flex;flex-direction:column;min-height:0}
/* NEW pieces (preview only): the headline pair, the product glimpse, the agreement line, the sheets */
.x-head{margin:var(--s6) 0 0;font-size:var(--t-5);font-weight:700;line-height:1.3;color:var(--text-1);max-width:300px}
.x-sub{margin:var(--s2) 0 auto;font-size:var(--t-3);line-height:1.5;color:var(--text-2)}
.x-glimpse{width:100%;max-width:320px;margin:var(--s6) 0 auto;display:grid;gap:8px;text-align:left}
.x-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-1);background:var(--surface)}
.x-row .bdg{flex:0 0 auto;width:36px;height:36px;border-radius:var(--r-btn);background:var(--raised);display:grid;place-items:center;font-size:var(--t-2);font-weight:600;color:var(--text-1)}
.x-row .who{flex:1;min-width:0}.x-row .who b{display:block;font-size:var(--t-3);font-weight:700;color:var(--text-1)}
.x-row .who span{display:block;font-size:var(--t-1,12px);color:var(--text-3)}
.x-row .amt{font-weight:700;font-size:var(--t-3);font-variant-numeric:tabular-nums}
.x-row .amt small{font-weight:400;font-size:.75em;margin-left:3px}
.x-in{color:var(--in)}.x-out{color:var(--out)}
.x-agree{margin:0 0 var(--s4);text-align:center;font-size:var(--t-2);line-height:1.5;color:var(--text-3)}
.x-agree button{display:inline;padding:0;margin:0;border:0;background:none;color:var(--text-1);font:inherit;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.x-scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:none}
.x-sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:86%;overflow-y:auto;padding:var(--s5) var(--gut) calc(var(--s6) + var(--pulo-layout-inset-bottom,0px));border-radius:20px 20px 0 0;background:var(--surface);transform:translateY(105%);transition:transform 260ms var(--ease-out)}
.x-sheet.on{transform:none}.x-scrim.on{display:block}
.x-sheet h3{margin:0;font-size:var(--t-4);font-weight:700;color:var(--text-1)}
.x-sheet .ld{margin:var(--s2) 0 0;font-size:var(--t-2);color:var(--text-2);line-height:1.5}
.x-sheet ul{margin:var(--s4) 0 0;padding:0 0 0 var(--s4);font-size:var(--t-2);line-height:1.6;color:var(--text-2)}
.x-sheet li{margin:0 0 var(--s2)}
.x-link{display:inline;padding:0;margin:0;border:0;background:none;color:var(--text-1);font:inherit;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.x-sheet .ft{margin:var(--s4) 0 0;font-size:var(--t-2);color:var(--text-3)}
.x-sheet p.l{margin:var(--s3) 0 0;font-size:var(--t-2);line-height:1.55;color:var(--text-2)}

/* r2: the owl (original drawing, monochrome, the wordmark's own ink) */
.x-owl{width:190px;height:190px;margin:var(--s6) 0 auto;color:var(--text-1);overflow:visible}
.x-owl .ink,.x-owl .inkc{fill:currentColor}
.x-owl .lidf{fill:var(--ground);transform-box:view-box;transform-origin:0 18px;transform:scaleY(0);animation:owlLid 5s infinite}
.x-owl .lash{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;opacity:0;animation:owlLash 5s infinite}
@keyframes owlLid{0%,90%{transform:scaleY(0)}93%,96%{transform:scaleY(1)}99%,100%{transform:scaleY(0)}}
@keyframes owlLash{0%,91.5%{opacity:0}93%,96%{opacity:1}97.5%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.x-owl .lidf,.x-owl .lash{animation:none}}
/* r2: the name field reads as a field: open box, dim example, initials inside it */
.x-fieldwrap{position:relative;margin-top:var(--s6)}
.x-field{width:100%;height:var(--field-h);padding:0 var(--s4);border:1.5px solid var(--text-3);border-radius:var(--r-1);background:transparent;color:var(--text-1);font:inherit;font-size:var(--t-3);outline:none;transition:border-color 160ms var(--ease-out),padding 160ms var(--ease-out)}
.x-field:focus{border-color:var(--text-1)}
.x-field::placeholder{color:var(--text-3);opacity:.45}
.x-fieldwrap.has .x-field{padding-left:58px}
.x-ini{position:absolute;left:10px;top:50%;width:36px;height:36px;margin-top:-18px;border-radius:var(--r-btn);background:var(--surface);display:grid;place-items:center;font-size:var(--t-2);font-weight:600;color:var(--text-1);opacity:0;transform:scale(.7);transition:opacity 160ms,transform 200ms var(--ease-out);pointer-events:none}
.x-fieldwrap.has .x-ini{opacity:1;transform:none}
.x-hint{margin:var(--s3) 0 0;font-size:var(--t-2);color:var(--text-3)}
/* preview controls */
.pv{position:fixed;left:8px;right:8px;top:calc(var(--pulo-layout-inset-top,0px) + 34px);z-index:50;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font:600 11px/1 system-ui,sans-serif}
.pv button{padding:7px 10px;border-radius:999px;border:1px solid rgba(128,128,128,.35);background:rgba(128,128,128,.14);color:var(--text-2);font:inherit}
.pv button[aria-pressed="true"]{background:var(--text-1);color:var(--ground)}
.pv.hide{display:none}
.pvh{position:fixed;top:calc(var(--pulo-layout-inset-top,0px) + 6px);left:6px;z-index:51;width:34px;height:22px;border-radius:999px;border:0;background:rgba(128,128,128,.12);color:var(--text-3);font:700 12px/1 system-ui;opacity:.55}
.tag{position:fixed;right:8px;top:calc(var(--pulo-layout-inset-top,0px) + 8px);z-index:51;font:700 10px/1 system-ui;letter-spacing:.04em}
.tag.new{color:#3fae6a}.tag.old{color:#c9a227}
</style>

  var CHK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.6 12.6l5 5 9.8-11"/></svg>';
  var scr=document.getElementById('scr'),sheet=document.getElementById('sheet'),scrim=document.getElementById('scrim');
  var s='welcome', old=false, ticked=false, ticked2=false, name='';
  /* Made-up names and amounts only. */
  var TERMS_NEW='<h3>Terms of use</h3><p class="ld">Pulo records who owes you and who you owe. You agree that:</p><ul>'+
    '<li>You’re responsible for what you record. Pulo doesn’t check it.</li>'+
    '<li>Pulo is a record-keeping tool. It is not a lender or a collections service.</li>'+
    '<li>Your data is used only to run your ledger.</li></ul><p class="ft">Read the <button class="x-link" data-full="1">full terms</button> before you join.</p>';
  var NUMBER='<h3>Why Pulo asks for your number</h3><p class="l">It is how support can find your account.</p><p class="l">Pulo never sends you an SMS.</p>';
  function open(h){sheet.innerHTML=h;sheet.classList.add('on');scrim.classList.add('on');var f=sheet.querySelector('[data-full]');if(f)f.onclick=function(){open(FULL)}}
  var FULL='<h3>Full terms</h3><p class="l">In the app, this link opens Pulo’s public Terms page in the browser. Anyone can read it without joining.</p><p class="l">The page itself is written later; this preview only shows where it opens.</p>';
  function close(){sheet.classList.remove('on');scrim.classList.remove('on')}
  scrim.onclick=close;
  function mark(c){return '<span class="'+c+'">'+MARK+'</span>'}
  function welcome(){
    if(!old) return '<div class="wl-screen"><div class="wl-body">'+mark('wl-mark')+
      '<h1 class="x-head">Track who owes you, and who you owe.</h1><p class="x-sub" style="margin-bottom:0">Right inside Telegram.</p>'+
      OWL+'</div>'+
      '<div class="wl-foot">'+
      '<p class="x-agree">By tapping Get started, you share <button data-sheet="num">your number</button> and accept the <button data-sheet="terms">Terms</button>.</p>'+
      '<button class="wl-go" type="button" data-go="name">Get started</button></div></div>';
    return '<div class="wl-screen"><div class="wl-body">'+mark('wl-mark')+'<p class="wl-tag">Track who owes you, and who you owe, right inside Telegram.</p></div>'+
      '<div class="wl-foot"><p class="wl-note">'+TG+'<span><b>Your Telegram account is your account.</b> No password to remember, and nothing new to install.</span></p>'+
      '<div class="wl-agree" data-on="'+ticked+'"><button class="wl-tick" type="button" aria-pressed="'+ticked+'" id="tk"><span class="wl-box">'+CHK+'</span></button>'+
      '<p class="wl-agree-text" id="tk2">I agree to share <button class="wl-link" data-sheet="num">my number</button> with Pulo.</p></div>'+
      '<p class="wl-why">'+(ticked?'':'Tick the box to continue.')+'</p><button class="wl-go" type="button" '+(ticked?'data-go="terms"':'disabled')+'>Get started</button></div></div>';
  }
  function terms(){
    if(!old) return '<div class="wl-screen"><div class="wl-body" style="justify-content:center"><p class="x-sub" style="margin:auto 0">In the proposal there is no Terms screen.<br>The Terms open from the link on Welcome, as a sheet.</p></div>'+
      '<div class="wl-foot"><button class="wl-go" type="button" data-sheet="terms">Open the Terms sheet</button></div></div>';
    return '<div class="tm-screen"><div class="tm-body">'+mark('tm-mark')+'<h1 class="tm-title">Terms of use</h1>'+
      '<p class="nm-lead">You agree to this once, and it covers every business you ever run on Pulo.</p>'+
      '<div class="tm-terms">Pulo helps you record who owes you money and who you owe. By continuing you agree that:<ul>'+
      '<li>debts are recorded from what you and your customers tell each other, and Pulo does not verify them;</li><li>Pulo is a record-keeping tool, not a lender and not a collections service;</li><li>you are responsible for the accuracy of what you record;</li><li>your data is used only to run the ledger you see.</li></ul><br>The full terms are in My account, any time.</div>'+
      '<button class="tm-agree" type="button" aria-pressed="'+ticked2+'" id="tk3"><span class="tm-box">'+CHK+'</span><span>I agree to Pulo’s Terms of Use</span></button></div>'+
      '<div class="tm-foot"><p class="tm-why">'+(ticked2?'':'Tick the box to continue.')+'</p><button class="tm-go" type="button" '+(ticked2?'data-go="name"':'disabled')+'>Join Pulo</button></div></div>';
  }
  function initials(n){var w=n.trim().split(/\s+/).filter(function(x){return !/^(on|of|the|and|da|va|и|в)$/i.test(x)});if(!w.length)return'';return w.length===1?w[0].slice(0,2).toUpperCase():(w[0][0]+w[1][0]).toUpperCase()}
  function nameS(){
    var has=name.trim()!=='';
    if(!old) return '<div class="nm-screen"><div class="nm-body">'+mark('nm-mark')+
      '<h1 class="nm-title">What’s your store called?</h1><p class="nm-lead">Your customers will see this name.</p>'+
      '<label class="x-fieldwrap'+(has?' has':'')+'" id="fw"><span class="x-ini" id="ini">'+initials(name)+'</span>'+
      '<input class="x-field" id="nf" type="text" autocomplete="off" aria-label="Store name" placeholder="e.g. Bakery on Chorsu" value="'+name.replace(/"/g,'&quot;')+'"></label>'+
      '<p class="x-hint">You can change it later.</p></div>'+
      '<div class="nm-foot"><p class="nm-why" id="nw"></p><button class="nm-go" id="ng" type="button" '+(has?'':'disabled')+'>Create store</button></div></div>';
    return '<div class="nm-screen"><div class="nm-body">'+mark('nm-mark')+
      '<h1 class="nm-title">What is your store called?</h1>'+
      '<p class="nm-lead">Whatever you call it here becomes your first store: the one every debt lands in until you add another.</p>'+
      '<input class="nm-field" id="nf" type="text" autocomplete="off" placeholder="Bakery on Chorsu" value="'+name.replace(/"/g,'&quot;')+'">'+
      '<div id="pvw">'+(has?'<div class="nm-preview"><span class="bdg">'+initials(name)+'</span><span class="txt"><span class="nm">'+name.replace(/</g,'&lt;')+'</span><span class="sb">Your first store</span></span></div>':'')+'</div></div>'+
      '<div class="nm-foot"><p class="nm-why" id="nw">'+(has?'':'Give your store a name.')+'</p><button class="nm-go" id="ng" type="button" '+(has?'':'disabled')+'>Create it</button></div></div>';
  }
  function draw(){
    scr.innerHTML=s==='welcome'?welcome():s==='terms'?terms():nameS();
    var t=document.getElementById('tag');t.textContent=old?'TODAY':'PROPOSED';t.className='tag '+(old?'old':'new');
    [].forEach.call(document.querySelectorAll('.pv [data-s]'),function(b){b.setAttribute('aria-pressed',b.dataset.s===s?'true':'false')});
    [].forEach.call(scr.querySelectorAll('[data-sheet]'),function(b){b.addEventListener('click',function(e){e.stopPropagation();open(b.dataset.sheet==='num'?NUMBER:TERMS_NEW)})});
    [].forEach.call(scr.querySelectorAll('[data-go]'),function(b){b.addEventListener('click',function(){s=b.dataset.go;draw()})});
    var tk=document.getElementById('tk'),tk2=document.getElementById('tk2'),tk3=document.getElementById('tk3');
    if(tk){tk.onclick=function(){ticked=!ticked;draw()};tk2.onclick=function(){ticked=!ticked;draw()}}
    if(tk3){tk3.onclick=function(){ticked2=!ticked2;draw()}}
    var nf=document.getElementById('nf');
    if(nf){nf.oninput=function(){name=nf.value;var has=name.trim()!=='';
      var fw=document.getElementById('fw');
      if(fw){fw.classList.toggle('has',has);document.getElementById('ini').textContent=initials(name);}
      else{document.getElementById('pvw').innerHTML=has?'<div class="nm-preview"><span class="bdg">'+initials(name)+'</span><span class="txt"><span class="nm">'+name.replace(/</g,'&lt;')+'</span><span class="sb">Your first store</span></span></div>':'';
        document.getElementById('nw').textContent=has?'':'Give your store a name.';}
      var g=document.getElementById('ng');if(has)g.removeAttribute('disabled');else g.setAttribute('disabled','')}}
  }
  [].forEach.call(document.querySelectorAll('.pv [data-s]'),function(b){b.addEventListener('click',function(){close();s=b.dataset.s;draw()})});
  document.getElementById('mode').addEventListener('click',function(){close();old=!old;this.textContent=old?'Show proposed':'Show today\'s';draw()});
      document.getElementById('th').addEventListener('click',function(){var r=document.documentElement;r.setAttribute('data-theme',r.getAttribute('data-theme')==='light'?'dark':'light')});
  document.getElementById('hide').addEventListener('click',function(){document.getElementById('pv').classList.add('hide')});
  document.getElementById('pvh').addEventListener('click',function(){document.getElementById('pv').classList.toggle('hide')});
  draw();
  window.addEventListener('load',function(){ if(window.PT){PT.main(null);} var T=window.Telegram&&Telegram.WebApp;
    if(T&&T.platform&&T.platform!=='unknown'){var a=T.safeAreaInset||{},c=T.contentSafeAreaInset||{};
      document.documentElement.style.setProperty('--pulo-layout-inset-top',((a.top||0)+(c.top||0))+'px');
      document.documentElement.style.setProperty('--pulo-layout-inset-bottom',((a.bottom||0)+(c.bottom||0))+'px');}});
})();
</script>
