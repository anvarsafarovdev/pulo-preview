/* the ending: to Welcome the screen fades and the mark stays exactly where it is; to the app it lifts away */
.sp.toWelcome.gone .sp-m{opacity:1}
.sp.toApp .sp-m{transition:transform 360ms var(--ease-out,ease),opacity 300ms}
.sp.toApp.gone .sp-m{transform:scale(.92);opacity:0}
.tgsim{position:fixed;inset:0;z-index:60;background:var(--ground);display:flex;align-items:center;justify-content:center}
.tgsim svg{width:120px;height:56px;color:var(--text-1)}
.tgsim i{position:absolute;bottom:calc(var(--pulo-layout-inset-bottom,0px) + 70px);font:600 11px system-ui;color:var(--text-3);font-style:normal}
.appsk{position:fixed;inset:0;z-index:40;background:var(--ground);padding:calc(var(--pulo-layout-inset-top,0px) + 56px) 20px 0;display:none}
.appsk.on{display:block}
.appsk b{display:block;height:84px;border-radius:16px;background:var(--surface);margin-bottom:14px}
.appsk b:nth-child(2){height:44px;width:70%}
.appsk b:nth-child(n+3){height:56px}

/* 1 breathe */
.sp[data-a=breathe] .sp-m svg{animation:a-breathe 2.2s ease-in-out infinite}
@keyframes a-breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.97)}}
/* 2 heartbeat */
.sp[data-a=heartbeat] .sp-m svg{animation:a-beat 1.6s ease-in-out infinite}
@keyframes a-beat{0%,40%,100%{transform:scale(1)}10%{transform:scale(1.07)}20%{transform:scale(1)}30%{transform:scale(1.045)}}
/* 3 shimmer */
.sp[data-a=shimmer] .sp-mask{opacity:1;background:linear-gradient(100deg,transparent 30%,var(--ground) 50%,transparent 70%) 0 0/250% 100%;mix-blend-mode:normal;animation:a-shim 1.8s linear infinite;opacity:.75}
@keyframes a-shim{from{background-position:120% 0}to{background-position:-120% 0}}
/* 4 cut light: a streak at the cuts' own 45° */
.sp[data-a=cutlight] .sp-mask{opacity:1;background:linear-gradient(135deg,transparent 42%,var(--ground) 50%,transparent 58%) 0 0/300% 300%;animation:a-cut 1.6s ease-in-out infinite;opacity:.85}
@keyframes a-cut{from{background-position:100% 100%}to{background-position:0 0}}
/* 5 o spins */
.sp[data-a=ospin] .L4{transform-box:view-box;transform-origin:1130.85px 304.8px;animation:a-spin 1.1s cubic-bezier(.5,.15,.5,.85) infinite}
@keyframes a-spin{to{transform:rotate(360deg)}}
/* 6 wave */
.sp[data-a=wave] .L{animation:a-wave 1.4s ease-in-out infinite}
.sp[data-a=wave] .L2{animation-delay:.12s}.sp[data-a=wave] .L3{animation-delay:.24s}.sp[data-a=wave] .L4{animation-delay:.36s}
@keyframes a-wave{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-14%)}}
/* 7 jump */
.sp[data-a=jump] .L{animation:a-jump 1.8s cubic-bezier(.3,.7,.4,1) infinite}
.sp[data-a=jump] .L2{animation-delay:.2s}.sp[data-a=jump] .L3{animation-delay:.4s}.sp[data-a=jump] .L4{animation-delay:.6s}
@keyframes a-jump{0%,40%,100%{transform:translateY(0) scale(1,1)}8%{transform:translateY(0) scale(1.08,.9)}20%{transform:translateY(-22%) scale(.96,1.05)}32%{transform:translateY(0) scale(1.05,.94)}}
/* 8 rise */
.sp[data-a=rise] .L{animation:a-rise 2.6s cubic-bezier(.2,.8,.2,1) infinite;opacity:0}
.sp[data-a=rise] .L2{animation-delay:.1s}.sp[data-a=rise] .L3{animation-delay:.2s}.sp[data-a=rise] .L4{animation-delay:.3s}
@keyframes a-rise{0%{opacity:0;transform:translateY(40%)}22%,78%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
/* 9 typewriter */
.sp[data-a=type] .L{animation:a-type 2.4s steps(1) infinite;opacity:0}
.sp[data-a=type] .L1{animation-name:a-t1}.sp[data-a=type] .L2{animation-name:a-t2}.sp[data-a=type] .L3{animation-name:a-t3}.sp[data-a=type] .L4{animation-name:a-t4}
@keyframes a-t1{0%{opacity:0}8%,88%{opacity:1}96%{opacity:0}}
@keyframes a-t2{0%,20%{opacity:0}22%,88%{opacity:1}96%{opacity:0}}
@keyframes a-t3{0%,34%{opacity:0}36%,88%{opacity:1}96%{opacity:0}}
@keyframes a-t4{0%,48%{opacity:0}50%,88%{opacity:1}96%{opacity:0}}
/* 10 draw */
.sp[data-a=draw] .L{fill:transparent;stroke:currentColor;stroke-width:6;stroke-dasharray:1;stroke-dashoffset:1;animation:a-draw 2.8s ease-in-out infinite}
@keyframes a-draw{0%{stroke-dashoffset:1;fill:transparent}55%{stroke-dashoffset:0;fill:transparent}75%,90%{stroke-dashoffset:0;fill:currentColor}100%{stroke-dashoffset:0;fill:transparent;opacity:0}}
/* 11 fill */
.sp[data-a=fill] .sp-m svg{opacity:.16}
.sp[data-a=fill] .sp-fill{display:block;animation:a-fill 2.2s cubic-bezier(.45,0,.3,1) infinite}
.sp-fill{display:none;position:absolute;inset:0}
.sp-fill svg{opacity:1!important}
@keyframes a-fill{0%{clip-path:inset(100% 0 0 0)}70%,90%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0);opacity:0}}
/* 12 focus */
.sp[data-a=blur] .sp-m svg{animation:a-blur 2.6s ease-out infinite}
@keyframes a-blur{0%{filter:blur(12px);opacity:0;transform:scale(1.08)}35%{filter:blur(0);opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:.6}}
/* 13 drop */
.sp[data-a=drop] .sp-m svg{animation:a-drop 1s cubic-bezier(.3,1.4,.5,1) both,a-breathe 2.2s ease-in-out 1s infinite}
@keyframes a-drop{0%{transform:translateY(-140%);opacity:0}60%{opacity:1}100%{transform:translateY(0)}}
/* 14 sway */
.sp[data-a=sway] .sp-m{perspective:600px}
.sp[data-a=sway] .sp-m svg{animation:a-sway 2.4s ease-in-out infinite}
@keyframes a-sway{0%,100%{transform:rotateY(-18deg)}50%{transform:rotateY(18deg)}}
/* 15 ripple */
.sp-r{display:none;position:absolute;left:50%;top:50%;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;border:1.5px solid var(--text-3);opacity:0}
.sp[data-a=ripple] .sp-r{display:block;animation:a-rip 2.4s ease-out infinite}
.sp[data-a=ripple] .sp-r+.sp-r{animation-delay:.8s}.sp[data-a=ripple] .sp-r+.sp-r+.sp-r{animation-delay:1.6s}
@keyframes a-rip{0%{transform:scale(.6);opacity:.6}100%{transform:scale(1.7);opacity:0}}
/* 16 orbit */
.sp-o{display:none;position:absolute;left:50%;top:50%;width:0;height:0}
.sp-o::after{content:"";position:absolute;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:var(--text-1);transform:translateX(118px)}
.sp[data-a=orbit] .sp-o{display:block;animation:a-orb 1.6s linear infinite;transform:scaleY(.42)}
@keyframes a-orb{from{rotate:0deg}to{rotate:360deg}}
/* 17 line */
.sp-l{display:none;position:absolute;left:10%;right:10%;top:calc(100% + 26px);height:3px;border-radius:2px;background:var(--surface);overflow:hidden}
.sp-l::after{content:"";position:absolute;top:0;bottom:0;width:40%;border-radius:2px;background:var(--text-1);animation:a-line 1.3s cubic-bezier(.6,0,.4,1) infinite}
.sp[data-a=line] .sp-l{display:block}
@keyframes a-line{from{left:-40%}to{left:100%}}
/* 18 dots */
.sp-d{display:none;position:absolute;left:0;right:0;top:calc(100% + 22px);justify-content:center;gap:8px}
.sp-d i{width:8px;height:8px;border-radius:50%;background:var(--text-1);animation:a-dot 1.2s ease-in-out infinite}
.sp-d i:nth-child(2){animation-delay:.15s}.sp-d i:nth-child(3){animation-delay:.3s}
.sp[data-a=dots] .sp-d{display:flex}
@keyframes a-dot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-6px)}}
/* 19 spotlight */
.sp[data-a=spot] .sp-m svg{opacity:.22}
.sp[data-a=spot] .sp-mask{opacity:1;background:radial-gradient(circle at center,var(--text-1) 0,var(--text-1) 18%,transparent 34%) 0 0/60% 220% no-repeat;animation:a-spot 2s ease-in-out infinite alternate}
@keyframes a-spot{from{background-position:-40% 50%}to{background-position:140% 50%}}
/* 20 owl: the Welcome owl, in its own place, blinking (its own blink, sped up) */
.sp-owl{display:none;position:absolute}
.sp[data-a=owl] .sp-owl{display:block}
.sp-owl .wl-owl{width:100%!important;height:auto!important;margin:0!important}
.sp-owl .lid{animation:a-blink 2.4s infinite}
@keyframes a-blink{0%,88%,100%{transform:translateY(-100%)}93%{transform:translateY(0)}}
.sp-owl svg{animation:a-look 3.6s ease-in-out infinite}
@keyframes a-look{0%,30%,100%{transform:rotate(0)}40%,55%{transform:rotate(-6deg)}65%,85%{transform:rotate(5deg)}}

@media (prefers-reduced-motion: reduce){.sp *{animation-duration:4s!important}}

<script>
(function(){
  var TG=window.Telegram&&window.Telegram.WebApp, inTG=!!(TG&&TG.platform&&TG.platform!=='unknown');
  if(inTG){try{TG.ready();TG.expand();if(TG.requestFullscreen&&!TG.isFullscreen)TG.requestFullscreen();TG.disableVerticalSwipes&&TG.disableVerticalSwipes()}catch(e){}}
  function insets(){if(!inTG)return;var a=TG.safeAreaInset||{},c=TG.contentSafeAreaInset||{},r=document.documentElement.style;
    r.setProperty('--pulo-layout-inset-top',((a.top||0)+(c.top||0))+'px');r.setProperty('--pulo-layout-inset-bottom',((a.bottom||0)+(c.bottom||0))+'px');
    r.setProperty('--pulo-layout-inset-left',(a.left||0)+'px');r.setProperty('--pulo-layout-inset-right',(a.right||0)+'px');place()}
  if(inTG){try{['safeAreaChanged','contentSafeAreaChanged','viewportChanged','fullscreenChanged'].forEach(function(e){TG.onEvent(e,insets)})}catch(e){}}
  var DESC={"breathe":"The mark gently fades and swells, like breathing.","heartbeat":"Two soft beats, a pause, repeat.","shimmer":"A soft light sweeps across the letters.","cutlight":"A light streak runs along the angle of the cuts in the P and the o.","ospin":"The o, with its two cuts, turns like a loading ring.","wave":"P, u, l, o bob up and down one after another.","jump":"Each letter hops in turn, with a little squash.","rise":"The letters rise into place one by one, then fade and repeat.","type":"P, u, l, o appear one at a time, then start again.","draw":"The outline of the mark is drawn, then filled in.","fill":"The mark fills from the bottom like a glass.","blur":"The mark comes into focus from a blur, then breathes.","drop":"The mark drops in, bounces once, then breathes.","sway":"The mark turns gently left and right in 3D.","ripple":"Soft rings spread out behind the mark.","orbit":"A small dot circles the mark.","line":"A thin line under the mark runs while it loads.","dots":"Three dots under the mark, like \"typing…\".","spot":"A spotlight moves across, lighting the letters.","owl":"The mark stays still; the owl below blinks and looks around."};
  var q=new URLSearchParams(location.search), st={a:q.get('a')||'breathe',t:q.has('t')?+q.get('t'):3000,e:q.get('e')||'welcome',tg:q.get('tg')==='1'};
  var sp=document.getElementById('sp'), spm=document.getElementById('spm'), owl=document.getElementById('spowl'), pv=document.getElementById('pv'), timer=null;
  function place(){
    var m=document.querySelector('#app .wl-mark'); if(!m)return;
    var r=m.getBoundingClientRect(); spm.style.left=r.left+'px'; spm.style.top=r.top+'px'; spm.style.width=r.width+'px'; spm.style.height=r.height+'px';
    var w=document.querySelector('#app .wl-owl');
    if(w){var o=w.getBoundingClientRect();owl.style.left=o.left+'px';owl.style.top=o.top+'px';owl.style.width=o.width+'px';if(!owl.firstChild)owl.appendChild(w.cloneNode(true))}
  }
  function mark(){[].forEach.call(document.querySelectorAll('[data-a]'),function(b){if(b.tagName==='BUTTON')b.setAttribute('aria-pressed',b.getAttribute('data-a')===st.a)});
    [].forEach.call(document.querySelectorAll('[data-t]'),function(b){b.setAttribute('aria-pressed',+b.getAttribute('data-t')===st.t)});
    [].forEach.call(document.querySelectorAll('[data-e]'),function(b){b.setAttribute('aria-pressed',b.getAttribute('data-e')===st.e)});
    document.getElementById('tgs').setAttribute('aria-pressed',st.tg);
    document.getElementById('pvp').textContent=DESC[st.a]+' (Loading '+(st.t?(st.t/1000)+' s':'until you tap Finish')+'; then '+(st.e==='welcome'?'the Welcome page':'the app')+'.)'}
  function finish(){clearTimeout(timer);sp.classList.add('gone');if(st.e==='app')document.getElementById('appsk').classList.add('on')}
  function play(){
    clearTimeout(timer);mark();place();
    document.getElementById('appsk').classList.remove('on');
    sp.className='sp '+(st.e==='welcome'?'toWelcome':'toApp');sp.removeAttribute('data-a');void sp.offsetWidth;sp.setAttribute('data-a',st.a);
    var start=function(){if(st.t)timer=setTimeout(finish,st.t)};
    if(st.tg){var s=document.createElement('div');s.className='tgsim';s.innerHTML='<svg viewBox="0 0 1298 609"><path fill="currentColor" d="'+document.querySelector('.sp-fill path').getAttribute('d')+'"/></svg><i>Telegram\'s own still logo (a guess at its size and place)</i>';document.body.appendChild(s);
      sp.style.visibility='hidden';setTimeout(function(){s.remove();sp.style.visibility='';start()},900)}else start();
  }
  [].forEach.call(document.querySelectorAll('button[data-a]'),function(b){b.addEventListener('click',function(){st.a=b.getAttribute('data-a');pv.classList.add('hide');play()})});
  [].forEach.call(document.querySelectorAll('[data-t]'),function(b){b.addEventListener('click',function(){st.t=+b.getAttribute('data-t');mark()})});
  [].forEach.call(document.querySelectorAll('[data-e]'),function(b){b.addEventListener('click',function(){st.e=b.getAttribute('data-e');mark()})});
  document.getElementById('play').addEventListener('click',function(){pv.classList.add('hide');play()});
  document.getElementById('fin').addEventListener('click',finish);
  document.getElementById('tgs').addEventListener('click',function(){st.tg=!st.tg;mark()});
  document.getElementById('th').addEventListener('click',function(){var t=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';if(window.PT)PT.setTheme(t);else document.documentElement.setAttribute('data-theme',t)});
  document.getElementById('hide').addEventListener('click',function(){pv.classList.add('hide')});
  document.getElementById('pvh').addEventListener('click',function(){pv.classList.toggle('hide')});
  sp.addEventListener('click',function(){if(sp.classList.contains('gone'))return});
  document.addEventListener('click',function(ev){if(sp.classList.contains('gone')&&!pv.contains(ev.target)&&ev.target.id!=='pvh'&&!document.getElementById('app').contains(ev.target)){}});
  window.addEventListener('resize',place);
  var s=document.createElement('script');s.src='../js/splash-r1.js?v=202611202200';s.onload=function(){var n=0;(function wait(){if(document.querySelector('#app .wl-mark')){insets();setTimeout(function(){place();mark()},120);(document.fonts&&document.fonts.ready||Promise.resolve()).then(place)}else if(n++<100)setTimeout(wait,30)})()};document.body.appendChild(s);
  mark();
})();
</script>
