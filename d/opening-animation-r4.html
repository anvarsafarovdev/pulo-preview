<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">

<title>Opening animation r4</title>

<style>
/* ═══ THE OPENING (r2), the founder's flow of 20 Nov:
   Telegram's still logo in the centre → ours takes over in the SAME place and size → the o spins.
   New person: at least two turns, the o stops upright, the mark rises to where Welcome draws it, Welcome appears.
   Signed up: the o spins for as long as loading takes, stops upright, the app appears. ═══ */
.sp{position:fixed;inset:0;z-index:50;background:var(--ground);transition:opacity 320ms var(--ease-out,ease)}
.sp.gone{opacity:0;pointer-events:none}
.sp.keep.gone{opacity:1;background:transparent}
.sp-m{position:absolute;color:var(--text-1);will-change:transform;transform-origin:0 0}
:root{--tg-faint:#EBEBEB}[data-theme=dark]{--tg-faint:#313438}
.sp-m.faint{color:var(--tg-faint)}
.tgsim{color:var(--tg-faint)!important}
.sp-m svg{display:block;width:100%;height:100%;overflow:visible}
.sp-m .o{transform-box:view-box;transform-origin:1130.85px 304.8px}
.tgsim{position:fixed;inset:0;z-index:60;background:var(--ground);color:var(--text-1)}
.tgsim svg{position:absolute;display:block}
.tgsim i{position:absolute;left:0;right:0;bottom:calc(var(--pulo-layout-inset-bottom,0px) + 70px);text-align:center;font:600 11px system-ui;color:var(--text-3);font-style:normal}
.appsk{position:fixed;inset:0;z-index:40;background:var(--ground);padding:calc(var(--pulo-layout-inset-top,0px) + 56px) 20px 0;display:none}
.appsk.on{display:block}
.appsk em{display:block;font:600 11px system-ui;color:var(--text-3);font-style:normal;margin-bottom:12px}
.appsk b{display:block;height:84px;border-radius:16px;background:var(--surface);margin-bottom:14px}
.appsk b:nth-of-type(2){height:44px;width:70%}
.appsk b:nth-of-type(n+3){height:56px}
#app{visibility:hidden}
#app.show{visibility:visible;animation:wl-in 380ms var(--ease-out,ease) both}
@keyframes wl-in{from{opacity:0}to{opacity:1}}
</style>
<style>
/* preview chrome (not part of the design) */
.pv{position:fixed;left:8px;right:8px;top:calc(var(--pulo-layout-inset-top,0px) + 34px);z-index:85;max-height:70vh;overflow:auto;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font:600 11px/1 system-ui,sans-serif;padding:8px;border-radius:14px;background:rgba(128,128,128,.2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pv p{flex:1 1 100%;margin:0 0 4px;padding:8px 10px;border-radius:10px;background:var(--ground);font:600 11px/1.45 system-ui;color:#2e9a5a}
.pv b.h{flex:1 1 100%;font:700 10px/1 system-ui;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.pv button{padding:7px 10px;border-radius:999px;border:1px solid rgba(128,128,128,.35);background:var(--ground);color:var(--text-2);font:inherit;cursor:pointer}
.pv button[aria-pressed="true"]{background:var(--text-1);color:var(--ground)}
.pv.hide{display:none}
.pvh{z-index:90!important;position:fixed;top:calc(var(--pulo-layout-inset-top,0px) + 6px);left:50%;transform:translateX(-50%);z-index:81;width:34px;height:22px;border-radius:999px;border:0;background:rgba(128,128,128,.14);color:var(--text-3);font:700 12px/1 system-ui;opacity:.6}
.tag{position:fixed;right:8px;top:calc(var(--pulo-layout-inset-top,0px) + 8px);z-index:81;font:700 10px/1 system-ui;letter-spacing:.04em;color:#3fae6a;pointer-events:none}
.tag.old{color:#c0392b}
.fb-back{position:fixed;left:8px;top:calc(var(--pulo-layout-inset-top,0px) + 6px);z-index:82;height:26px;padding:0 10px;border-radius:999px;border:0;background:rgba(128,128,128,.18);color:var(--text-2);font:600 12px/1 system-ui}
.fb-back[hidden]{display:none}
</style>
</head>
<body>
<div id="app"></div>
<div class="appsk" id="appsk"><em>(the app's Home loads here)</em><b></b><b></b><b></b><b></b><b></b><b></b></div>

</div>
<button class="pvh" id="pvh" type="button" aria-label="Preview">···</button>
<div class="pv hide" id="pv">
  <p id="pvp"></p>
  <b class="h">Who opens Pulo</b>
  <button data-e="welcome">New person (ends on Welcome)</button><button data-e="app">Signed up (ends on the app)</button>
  <b class="h">Loading takes</b>
  <button data-t="500">0.5 s</button><button data-t="1500">1.5 s</button><button data-t="3000">3 s</button><button data-t="6000">6 s</button><button data-t="0">Until I tap Finish</button>
  <b class="h">Play</b>
  <button id="play">▶ Play again</button><button id="fin">Finish</button><button id="tgs">Telegram's still logo first</button><button id="th">Theme</button><button id="hide">Hide</button>
</div>
<script>
(function(){
  var TG=window.Telegram&&window.Telegram.WebApp, inTG=!!(TG&&TG.platform&&TG.platform!=='unknown');
  if(inTG){try{TG.ready();TG.expand();if(TG.requestFullscreen&&!TG.isFullscreen)TG.requestFullscreen();TG.disableVerticalSwipes&&TG.disableVerticalSwipes()}catch(e){}}
  function insets(){if(!inTG)return;var a=TG.safeAreaInset||{},c=TG.contentSafeAreaInset||{},r=document.documentElement.style;
    r.setProperty('--pulo-layout-inset-top',((a.top||0)+(c.top||0))+'px');r.setProperty('--pulo-layout-inset-bottom',((a.bottom||0)+(c.bottom||0))+'px');
    r.setProperty('--pulo-layout-inset-left',(a.left||0)+'px');r.setProperty('--pulo-layout-inset-right',(a.right||0)+'px')}
  if(inTG){try{['safeAreaChanged','contentSafeAreaChanged','viewportChanged','fullscreenChanged'].forEach(function(e){TG.onEvent(e,insets)})}catch(e){}}
  var TURN=1100, MIN_NEW=2, RISE=520;
  var q=new URLSearchParams(location.search), st={t:q.has('t')?+q.get('t'):1500,e:q.get('e')||'welcome',tg:q.get('tg')!=='0'};
  var sp=document.getElementById('sp'), spm=document.getElementById('spm'), oo=document.getElementById('oo'), pv=document.getElementById('pv'), app=document.getElementById('app'), sk=document.getElementById('appsk');
  var W0=113,H0=113*609/1298,W=170,H=79.6875, spin=null, loaded=false, timer=null, run=0;
  function centre(){var w=innerWidth,h=innerHeight;return {x:(w-W0)/2,y:(h-H0)/2}}
  function welcomeRect(){var m=document.querySelector('#app .wl-mark');return m?m.getBoundingClientRect():null}
  function put(x,y){spm.style.left=x+'px';spm.style.top=y+'px';spm.style.width=W0+'px';spm.style.height=H0+'px';spm.style.transform=''}
  function mark(){[].forEach.call(document.querySelectorAll('[data-t]'),function(b){b.setAttribute('aria-pressed',+b.getAttribute('data-t')===st.t)});
    [].forEach.call(document.querySelectorAll('[data-e]'),function(b){b.setAttribute('aria-pressed',b.getAttribute('data-e')===st.e)});
    document.getElementById('tgs').setAttribute('aria-pressed',st.tg);
    document.getElementById('pvp').textContent=(st.e==='welcome'
      ?'New person: Telegram\'s faint still logo in the centre, then ours in the same place, size and tone; during the first turn it brightens to Pulo\'s colour; the o spins at least twice (longer if loading takes longer), stops upright, the mark rises to Welcome\'s place growing from 113 to Welcome\'s 170, and Welcome appears around it.'
      :'Signed up: Telegram\'s faint still logo in the centre, then ours in the same place, size and tone; it brightens during the first turn; the o spins for as long as loading takes, finishes its turn upright, and the app appears.')+' Loading here: '+(st.t?(st.t/1000)+' s.':'until you tap Finish.')}
  function maybeEnd(my){
    if(my!==run||!loaded||!spin)return;
    var turns=Math.floor((spin.currentTime||0)/TURN);
    var need=st.e==='welcome'?Math.max(MIN_NEW,turns+1):turns+1;
    spin.effect.updateTiming({iterations:need});
    spin.finished.then(function(){if(my!==run)return;
      if(st.e==='welcome'){
        var r=welcomeRect(),c=centre();
        var k=r.width/W0;var mv=spm.animate([{transform:'translate(0,0) scale(1)'},{transform:'translate('+(r.left-c.x)+'px,'+(r.top-c.y)+'px) scale('+k+')'}],{duration:RISE,easing:'cubic-bezier(.2,0,0,1)',fill:'forwards'});
        mv.finished.then(function(){if(my!==run)return;app.classList.add('show');sp.classList.add('keep','gone');sp.style.background='transparent'});
      }else{sk.classList.add('on');sp.classList.add('gone')}
    })}
  function finish(){loaded=true;maybeEnd(run)}
  function play(){
    run++;var my=run;clearTimeout(timer);loaded=false;mark();
    if(spin){spin.cancel();spin=null}
    spm.getAnimations().forEach(function(a){a.cancel()});
    app.classList.remove('show');sk.classList.remove('on');sp.className='sp';sp.style.background='';
    var c=centre();put(c.x,c.y);
    var go=function(){if(my!==run)return;
      spm.classList.add('faint');var tone=spm.animate([{color:getComputedStyle(document.documentElement).getPropertyValue('--tg-faint').trim()},{color:getComputedStyle(spm).getPropertyValue('--text-1').trim()||'currentColor'}],{duration:TURN,easing:'ease-in-out',fill:'forwards'});tone.finished.then(function(){if(my!==run)return;spm.classList.remove('faint');tone.cancel()});
      spin=oo.animate([{transform:'rotate(0deg)'},{transform:'rotate(360deg)'}],{duration:TURN,iterations:Infinity,easing:'cubic-bezier(.5,.15,.5,.85)'});
      if(st.t)timer=setTimeout(finish,st.t)};
    if(st.tg){var s=document.createElement('div');s.className='tgsim';
      s.innerHTML='<svg viewBox="0 0 1298 609" style="left:'+c.x+'px;top:'+c.y+'px;width:'+W0+'px;height:'+H0+'px"><path fill="currentColor" d="'+document.querySelector('#spm svg').innerHTML.match(/d="([^"]+)"/)[1]+'"/></svg>';
      var full=document.querySelector('#spm svg g').innerHTML;s.querySelector('svg').innerHTML='<g fill="currentColor">'+full+'</g>';
      s.insertAdjacentHTML('beforeend','<i>Telegram\'s own still logo (stand-in: 113 wide, Telegram\'s faint tone)</i>');
      document.body.appendChild(s);setTimeout(function(){s.remove();go()},900)}else go();
  }
  [].forEach.call(document.querySelectorAll('[data-t]'),function(b){b.addEventListener('click',function(){st.t=+b.getAttribute('data-t');mark()})});
  [].forEach.call(document.querySelectorAll('[data-e]'),function(b){b.addEventListener('click',function(){st.e=b.getAttribute('data-e');mark();pv.classList.add('hide');play()})});
  document.getElementById('play').addEventListener('click',function(){pv.classList.add('hide');play()});
  document.getElementById('fin').addEventListener('click',finish);
  document.getElementById('tgs').addEventListener('click',function(){st.tg=!st.tg;mark()});
  document.getElementById('th').addEventListener('click',function(){var t=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';if(window.PT)PT.setTheme(t);else document.documentElement.setAttribute('data-theme',t)});
  document.getElementById('hide').addEventListener('click',function(){pv.classList.add('hide')});
  document.getElementById('pvh').addEventListener('click',function(){pv.classList.toggle('hide')});
  var s=document.createElement('script');s.src='../js/splash-r1.js?v=202611202200';s.onload=function(){var n=0;(function wait(){if(document.querySelector('#app .wl-mark')){insets();(document.fonts&&document.fonts.ready||Promise.resolve()).then(function(){setTimeout(play,150)})}else if(n++<100)setTimeout(wait,30)})()};document.body.appendChild(s);
  mark();
})();
</script>
