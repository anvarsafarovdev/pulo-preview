/*
 * REDESIGN-5 PART C: Record payment as a tall sheet (the kit's Sheet, `tall`).
 * The drawing's rules (redesign-5-debt-payment-plan.html, 16) on the kit and
 * the tokens: no literal colour, duration or curve. The old `rp-*` page rules in
 * design/components.css are left untouched; this block uses its own `rps-`
 * names so the two never meet, and a later task removes the old ones.
 *
 * The Sheet owns the panel, the grab zone and the keyboard (its own tall CSS
 * sits above the keyboard through `.pulo-app`), so nothing here positions the
 * panel. `.rps-scroll` is bounded in px by RecordPaymentScreen.tsx from the
 * visual viewport; Confirm and the line above it sit below it, at the foot.
 */
.rps {
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.rps-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: none;
}
.rps-scroll::-webkit-scrollbar {
  display: none;
}
.rps-title {
  margin: 0;
  font-size: var(--t-4);
  font-weight: 700;
  color: var(--text-1);
}
.rps-to {
  margin: var(--s1) 0 0;
  font-size: var(--t-2);
  color: var(--text-3);
  overflow-wrap: break-word;
}
.rps-q {
  margin: var(--s4) 0 var(--s2);
  font-size: var(--t-2);
  color: var(--text-2);
}

/* One balance: its label and its remaining figure on one row. */
.rps-bal {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--s3);
  margin-top: var(--s3);
  padding: var(--s3) var(--s4);
  border-radius: var(--r-1);
  background: var(--ground);
  font-size: var(--t-2);
  color: var(--text-2);
}
.rps-bal b {
  font-size: var(--t-4);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  overflow-wrap: break-word;
  text-align: right;
}
.rps-in {
  color: var(--in);
}
.rps-out {
  color: var(--out);
}
.rps-done {
  color: var(--text-3);
}

/* The choice: one row per balance with its own figure; the chosen one is outlined (the outline glides on the kit's plate). */
.rps-kinds .rps-kindlist {
  display: grid;
  gap: var(--s2);
}
.rps-kindlist.feel-pill {
  --pill-plate: transparent;
  position: relative;
}
.rps-kindlist .feel-pill-plate {
  box-shadow: inset 0 0 0 2px var(--text-1);
  border-radius: var(--r-1);
}
.rps-kind {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--s3);
  width: 100%;
  padding: var(--s3) var(--s4);
  border: 0;
  border-radius: var(--r-1);
  background: var(--ground);
  color: var(--text-1);
  text-align: left;
  cursor: pointer;
}
.rps-kind .t {
  flex: 1 1 auto;
  min-width: 0;
  font-size: var(--t-2);
  font-weight: 600;
  overflow-wrap: break-word;
}
.rps-kind .a {
  flex: 0 1 auto;
  font-size: var(--t-3);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  overflow-wrap: break-word;
  text-align: right;
}
.rps-kind[aria-pressed='true'] {
  font-weight: 700;
}
.rps-kind:disabled {

  cursor: default;
}
.rps-kindwhy {
  margin: var(--s2) 0 0;
  font-size: var(--t-2);
  color: var(--text-3);
}

/* A payment already waiting. */

/* The amount: empty, in the display face, with the currency beside it. */
.rps-field {
  display: flex;
  align-items: baseline;
  justify-content: center;

  line-height: 1.1;
}
.rps-field .feel-rise-ov {
  padding: 0;
  justify-content: flex-end;
  font-size: var(--t-7);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.1;
  color: var(--in);
}
.rps-field.rps-out .feel-rise-ov {
  color: var(--out);
}
.rps-field.rps-done .feel-rise-ov {
  color: var(--text-3);
}
.rps-field .feel-rise input[data-fit='t-6'],
.rps-field .feel-rise input[data-fit='t-6'] + .feel-rise-ov {
  font-size: var(--t-6);
}
.rps-field .feel-rise input[data-fit='t-5'],
.rps-field .feel-rise input[data-fit='t-5'] + .feel-rise-ov {
  font-size: var(--t-5);
}
.rps-field .feel-rise input[data-fit='t-4'],
.rps-field .feel-rise input[data-fit='t-4'] + .feel-rise-ov {
  font-size: var(--t-4);
}
.rps-field .feel-rise input[data-fit='t-3'],
.rps-field .feel-rise input[data-fit='t-3'] + .feel-rise-ov {
  font-size: var(--t-3);
}
.rps-field .feel-rise input[data-fit='t-2'],
.rps-field .feel-rise input[data-fit='t-2'] + .feel-rise-ov {
  font-size: var(--t-2);
}
.rps-field .feel-rise input[data-fit='t-1'],
.rps-field .feel-rise input[data-fit='t-1'] + .feel-rise-ov {
  font-size: var(--t-2);
}
.rps-field input::placeholder {
  color: var(--text-3);
  opacity: 1;
}
.rps-field .cur {
  flex: 0 0 auto;
  margin: 0;
  font-size: var(--t-3);
  color: var(--text-3);
}

/* The quick chips; Clear rides in the row and is never lit. */
.rps-chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
  margin-top: var(--s2);
}
.rps-chips.feel-pill {
  --pill-plate: var(--ground);
}
.rps-chip {
  flex: 1 1 auto;
  min-height: var(--tap);
  padding: 0 var(--s4);
  border: 0;
  border-radius: var(--r-btn);
  background: var(--dim-plate);
  color: var(--text-dim);
  font-size: var(--t-2);
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  transition:
    background var(--dur-press) var(--ease-out),
    color var(--dur-press) var(--ease-out);
}
.rps-chip[aria-pressed='true'] {
  background: var(--ground);
  color: var(--text-1);
  font-weight: 600;
}
.rps-chip:disabled {
  opacity: 0.5;
  cursor: default;
}

/* The foot: the line above Confirm, then Confirm. Fixed below the scrolling content. */
.rps-foot {
  flex: 0 0 auto;
  padding-top: var(--s3);
  background: var(--surface);
}
.rps-after {
  display: flex;
  align-items: flex-start;
  gap: var(--s2);
  min-height: 1.5em;
  margin: 0 0 var(--s2);
  font-size: var(--t-2);
  line-height: 1.5;
  color: var(--text-2);
  overflow-wrap: break-word;
}
.rps-after[data-tone='idle'] {
  color: var(--text-3);
}
.rps-after b {
  display: block;
  color: var(--text-1);
  font-weight: 600;
}
.rps-confirm {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  width: 100%;
  min-height: 52px;
  padding: var(--s3) var(--s4);
  border: 0;
  border-radius: var(--r-1);
  background: var(--text-1);
  color: var(--ground);
  font-size: var(--t-3);
  font-weight: 700;
  cursor: pointer;
  transition: transform var(--dur-press) var(--ease-out);
}
.rps-confirm:active {
  transform: scale(0.985);
}
.rps-confirm:disabled {
  background: var(--dim-plate);
  color: var(--text-3);
  cursor: default;
  transform: none;
}

/* Inline SVG, sized once (the drawing carries no icon font). */
.rps svg.i {
  width: 22px;
  height: 22px;
  flex: 0 0 auto;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.rps svg.i.sm {
  width: 17px;
  height: 17px;
  stroke-width: 2;
}
.rps svg.i.xs {
  width: 16px;
  height: 16px;
  stroke-width: 2;
  margin-top: 2px;
}
.rps svg.f {
  width: 20px;
  height: 20px;
  flex: 0 0 auto;
  fill: currentColor;
}
/* ── PAY-2 r1: the owner's side ── */
.owe .a.in{color:var(--in)}
.owe .a.outc{color:var(--out)}
.alloc{padding:10px 2px}
.alloc .r b.in{color:var(--in)}
.alloc .nm{display:inline-block;margin-top:2px;font-size:12px;color:var(--text-2)}
/* the real sheet: the app's own .rps rules, inside a plain panel */
.psheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;display:flex;flex-direction:column;padding:var(--s3) var(--gut) calc(var(--s4) + var(--pulo-layout-inset-bottom,0px));border-radius:16px 16px 0 0;background:var(--surface)}
.psheet .grab{width:36px;height:4px;border-radius:2px;background:var(--text-3);opacity:.4;margin:0 auto var(--s3)}
.rps-kind[aria-pressed='true']{box-shadow:inset 0 0 0 2px var(--text-1)}
.rps-kind .t small{display:block;margin-top:2px;font-weight:500;color:var(--text-3)}
.rps-field input{width:7.5ch;border:0;background:none;outline:none;text-align:right;font:inherit;font-size:var(--t-7);font-weight:700;letter-spacing:-.02em;color:var(--in);font-variant-numeric:tabular-nums}
.rps-field.rps-out input{color:var(--out)}
.rps-field input::placeholder{color:var(--text-3)}
.rps-chip{font:inherit;font-size:var(--t-2);font-weight:600}
.rps-confirm{font:inherit;font-size:var(--t-3);font-weight:700}
.rps-kind{font:inherit}
/* approvals card, drawn with the app's own .ap-* rules */
.apwrap{margin-top:var(--s4)}
.ap-for{margin:2px 0 0;font-size:var(--t-2);color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap-for b{color:var(--text-1);font-weight:600}
.new{outline:2px dashed #c9a227;outline-offset:3px;border-radius:6px}
.nonew .new{outline:0}
.ap-kind svg{fill:none;stroke:currentColor;stroke-width:2}
.sec{margin:var(--s5) 0 var(--s2);font-size:var(--t-2);color:var(--text-3)}
/* preview chrome */
.pv{position:fixed;left:8px;right:8px;top:calc(var(--pulo-layout-inset-top,0px) + 34px);z-index:50;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font:600 11px/1 system-ui,sans-serif}
.pv button{padding:7px 10px;border-radius:999px;border:1px solid rgba(128,128,128,.35);background:rgba(128,128,128,.14);color:var(--text-2);font:inherit;cursor:pointer}
.pv button[aria-pressed="true"]{background:var(--text-1);color:var(--ground)}
.pv.hide{display:none}
.pvh{position:fixed;top:calc(var(--pulo-layout-inset-top,0px) + 6px);left:50%;transform:translateX(-50%);z-index:51;width:34px;height:22px;border-radius:999px;border:0;background:rgba(128,128,128,.12);color:var(--text-3);font:700 12px/1 system-ui;opacity:.55}
.tag{position:fixed;right:8px;top:calc(var(--pulo-layout-inset-top,0px) + 8px);z-index:51;font:700 10px/1 system-ui;letter-spacing:.04em;color:#3fae6a}
</style>
</head>
<body>
<div class="pulo-app" id="root"></div>
<span class="tag">PROPOSED r1</span>
<button class="pvh" id="pvh" type="button" aria-label="Preview">···</button>
<div class="pv hide" id="pv">
  <button data-s="debt">1 A debt</button>
  <button data-s="sheet">2 Record payment</button>
  <button data-s="all">3 Everything</button>
  <button data-s="waitdebt">4 Waiting on it</button>
  <button data-s="approve">5 Approvals</button>
  <button data-s="bill">6 A supplier’s bill</button>
  <button data-s="billsheet">7 Pay the bill</button>
  <button data-s="supplier">8 Supplier’s Approvals</button>
  <button id="marks">Marks</button>
  <button id="th">Theme</button>
  <button id="hide">Hide</button>
</div>
<script>
(function(){
  /* Made-up people, shops and amounts only. */
  var BACK='<svg viewBox="0 0 24 24"><path d="M14.6 5.4L9.1 10.5Q7.6 12 9.1 13.5L14.6 18.6"/></svg>';
  var WALLET='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.4a2 2 0 012-2h11.6a2 2 0 012 2v9.2a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><path d="M15.6 12h.15"/></svg>';
  var CHECK='<svg class="i xs" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var CLOCK='<svg class="i xs" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>';
  var CHECKS='<svg class="f" viewBox="0 0 24 24"><path d="M12 2.5a9.5 9.5 0 100 19 9.5 9.5 0 000-19zm4.3 7.2l-5 5.3a1 1 0 01-1.45.02L7.7 12.8a1 1 0 111.4-1.42l1.43 1.42 4.3-4.5a1 1 0 011.47 1.38z"/></svg>';
  function num(v){return parseInt(String(v).replace(/\D/g,''),10)||0}
  function fmt(v){return String(v).replace(/\B(?=(\d{3})+(?!\d))/g,' ')}

  /* Jahongir owes the shop 250 000 over three debts; the one opened is "3 bags of cement". */
  var P={name:'Jahongir',total:250000,debt:{t:'3 bags of cement',left:60000,orig:120000,paid:60000,rec:'2 Nov',due:'30 Nov'}};
  /* The shop owes BrickSupply 3 000 000; one bill is opened. */
  var B={name:'BrickSupply',total:3000000,bill:{t:'Bill of 14 Nov',left:1200000,orig:1200000,paid:0,rec:'14 Nov'}};
  var st={s:'debt',choice:'debt',amt:'',chip:null,wait:false};

  function topBack(){return '<div class="top"><button class="ibtn" aria-label="Back">'+BACK+'</button><span></span></div>'}

  function debtPage(bill){var who=bill?B:P, d=bill?B.bill:P.debt;
    var h='<div class="scr pb">'+topBack()+
      '<h1 class="dh one">'+d.t+'</h1><p class="ds">'+(bill?'From '+who.name:who.name)+'</p>'+
      '<div class="owe" style="margin-top:var(--s5)"><p class="k">'+(bill?'Left to pay':'Left to collect')+'</p><p class="a '+(bill?'outc':'in')+'">'+fmt(d.left)+'<small>UZS</small></p>'+
      (!bill?'<p class="d">Due '+d.due+'</p>':'')+
      (st.wait&&!bill?'<p class="pend new"><i></i>20 000 UZS waiting for you to confirm</p>':'')+'</div>'+
      '<div class="facts"><p><span>Recorded</span><b>'+d.rec+'</b></p><p><span>Amount</span><b>'+fmt(d.orig)+' UZS</b></p><p><span>'+(bill?'Paid so far':'Collected so far')+'</span><b>'+fmt(d.paid)+' UZS</b></p></div>';
    if(!bill){h+='<div class="new"><p class="lab">Payments that went to it</p>'+
      '<div class="alloc"><span><b class="in" style="color:var(--in)">40 000 UZS</b><span>5 Nov · oldest first</span></span></div>'+
      '<div class="alloc"><span><b class="in" style="color:var(--in)">20 000 UZS</b><span>12 Nov · for this debt</span></span></div></div>'}
    else h+='<p class="lab">Payments that went to it</p><p class="ds" style="margin:0">Nothing paid yet.</p>';
    h+='</div><div class="paybar nodock"><button class="dd-pay" data-open="'+(bill?'billsheet':'sheet')+'">'+WALLET+'Record payment</button></div>';
    return h}

  function sheet(bill){var who=bill?B:P, d=bill?B.bill:P.debt, one=st.choice==='debt';
    var bal=one?d.left:who.total, pend=st.wait&&!bill&&one;
    var a=num(st.amt), left=bal-a;
    var h='<div class="scrim" data-close></div><div class="psheet" role="dialog"><div class="grab"></div><div class="rps"><div class="rps-scroll">'+
      '<h2 class="rps-title">Record payment</h2><p class="rps-to">'+(bill?'To '+who.name:'From '+who.name)+'</p>'+
      '<div class="rps-kinds new"><p class="rps-q">What are you paying for?</p><div class="rps-kindlist" style="display:grid;gap:var(--s2)">'+
        '<button class="rps-kind" data-c="debt" aria-pressed="'+one+'"><span class="t">'+d.t+'<small>'+(bill?'This bill':'This debt')+'</small></span><span class="a">'+fmt(d.left)+'</span></button>'+
        '<button class="rps-kind" data-c="all" aria-pressed="'+!one+'"><span class="t">Everything, oldest first<small>'+(bill?'All you owe '+who.name:'All '+who.name+' owes')+'</small></span><span class="a">'+fmt(who.total)+'</span></button>'+
      '</div></div>';
    if(pend){h+='<div class="rps-wait new">'+CLOCK+'<span><b>A payment is already waiting on this debt</b>20 000 UZS was claimed for '+d.t+'. Confirm or dispute it first, or pay towards everything.</span></div>'}
    else{
      h+='<div class="rps-field '+(bill?'rps-out':'rps-in')+'"><input id="amt" inputmode="numeric" placeholder="0" value="'+(st.amt?fmt(a):'')+'"><p class="cur">UZS</p></div>'+
        '<div class="rps-chips">'+
        '<button class="rps-chip" data-chip="full" aria-pressed="'+(st.chip==='full')+'">Full · '+fmt(bal)+'</button>'+
        '<button class="rps-chip" data-chip="half" aria-pressed="'+(st.chip==='half')+'">Half · '+fmt(Math.round(bal/2))+'</button>'+
        '<button class="rps-chip" data-chip="clear" aria-pressed="false">Clear</button></div>'}
    h+='</div><div class="rps-foot">';
    var over=a>bal;
    if(pend) h+='<div class="rps-after" data-tone="idle">Confirm or dispute the payment already waiting on this debt first.</div>';
    else if(over) h+='<div class="rps-after">'+(one?(bill?'This bill has ':'This debt has ')+fmt(bal)+' UZS left. You cannot record more than that.':(bill?'You owe '+who.name+' ':who.name+' owes ')+fmt(bal)+' UZS. You cannot record more than that.')+'</div>';
    else if(!a) h+='<div class="rps-after" data-tone="idle">'+(bill?'Enter the amount you paid.':'Enter the amount you received.')+'</div>';
    else if(bill) h+='<div class="rps-after new" data-tone="wait">'+CLOCK+'<span><b>The balance does not change yet</b>'+who.name+' confirms it'+(one?', and it goes to '+d.t+'.':'.')+'</span></div>';
    else h+='<div class="rps-after new" data-tone="now">'+CHECK+'<span>'+(one?(left===0?'This settles '+d.t+'.':'Goes to '+d.t+'. Leaves '+fmt(left)+' UZS on it.'):(left===0?'This settles the balance.':'Leaves '+fmt(left)+' UZS.'))+'</span></div>';
    h+='<button class="rps-confirm" '+((pend||!a||over)?'disabled':'')+'>'+CHECKS+'Confirm payment</button></div></div></div>';
    return h}

  function card(o){return '<div class="ap-card" data-tone="loud" data-dir="'+o.dir+'"><p class="ap-kind">'+WALLET.replace('<svg','<svg class="i xs"')+'<span class="ap-kind-word">Payment</span><span class="ap-when">Today, 10:40</span></p>'+
    '<p class="ap-name">'+o.name+'</p><p class="ap-amt"><span class="ap-fig">'+o.amt+'</span> <span class="ap-cur">UZS</span></p>'+
    (o.for?'<p class="ap-for new">For: <b>'+o.for+'</b></p>':'')+
    (o.meta?'<p class="ap-meta">'+o.meta+'</p>':'')+
    
    '<div class="ap-acts"><button class="ap-no" type="button">Dispute</button><button class="ap-yes" type="button">Confirm</button></div></div>'}

  function approvals(supplier){
    return '<div class="scr">'+topBack()+'<h1 class="dh">Approvals</h1>'+
      (supplier?'<p class="sec">From businesses you supply</p>'+card({dir:'in',name:'Mirzo Market',amt:'1 200 000',for:'your bill of 14 Nov',meta:'Recorded by the owner',after:'Confirming applies it to that bill.'})
        :'<p class="sec">Payments to confirm</p>'+card({dir:'in',name:'Jahongir',amt:'20 000',for:'3 bags of cement',meta:'Recorded by Aziz · Chilonzor',after:'Confirming applies it to that debt.'})+
          card({dir:'in',name:'Dilnoza',amt:'15 000',for:null,meta:'Recorded by Aziz · Chilonzor',after:'Confirming applies it oldest first.'}))+
      '</div>'}

  var root=document.getElementById('root');
  function draw(){var s=st.s,h='';
    if(s==='debt')h=debtPage(false);
    else if(s==='sheet'||s==='all')h=debtPage(false)+sheet(false);
    else if(s==='waitdebt')h=debtPage(false)+(st.open?sheet(false):'');
    else if(s==='approve')h=approvals(false);
    else if(s==='bill')h=debtPage(true);
    else if(s==='billsheet')h=debtPage(true)+sheet(true);
    else if(s==='supplier')h=approvals(true);
    root.innerHTML=h;wire();
    [].forEach.call(document.querySelectorAll('.pv [data-s]'),function(b){b.setAttribute('aria-pressed',b.dataset.s===st.s?'true':'false')})}
  function wire(){
    [].forEach.call(root.querySelectorAll('[data-open]'),function(b){b.addEventListener('click',function(){
      if(st.s==='waitdebt'){st.open=true}else st.s=b.dataset.open;st.choice='debt';st.amt='';st.chip=null;draw()})});
    [].forEach.call(root.querySelectorAll('[data-close]'),function(b){b.addEventListener('click',function(){
      if(st.s==='waitdebt')st.open=false;else st.s=st.s==='billsheet'?'bill':'debt';draw()})});
    [].forEach.call(root.querySelectorAll('[data-c]'),function(b){b.addEventListener('click',function(){st.choice=b.dataset.c;st.amt='';st.chip=null;draw()})});
    [].forEach.call(root.querySelectorAll('[data-chip]'),function(b){b.addEventListener('click',function(){
      var bill=st.s==='billsheet', who=bill?B:P, d=bill?B.bill:P.debt, bal=st.choice==='debt'?d.left:who.total, c=b.dataset.chip;
      if(c==='clear'){st.amt='';st.chip=null}else{st.chip=c;st.amt=String(c==='full'?bal:Math.round(bal/2))}draw()})});
    var inp=document.getElementById('amt');
    if(inp)inp.addEventListener('input',function(){st.amt=String(num(inp.value)||'');st.chip=null;draw();var n=document.getElementById('amt');n.focus();n.setSelectionRange(n.value.length,n.value.length)});
  }
  [].forEach.call(document.querySelectorAll('.pv [data-s]'),function(b){b.addEventListener('click',function(){
    var s=b.dataset.s;st={s:s,choice:s==='all'?'all':'debt',amt:'',chip:null,wait:s==='waitdebt',open:false};draw()})});
  document.getElementById('marks').addEventListener('click',function(){document.body.classList.toggle('nonew')});
  document.getElementById('th').addEventListener('click',function(){var r=document.documentElement;r.setAttribute('data-theme',r.getAttribute('data-theme')==='light'?'dark':'light')});
  document.getElementById('hide').addEventListener('click',function(){document.getElementById('pv').classList.add('hide')});
  document.getElementById('pvh').addEventListener('click',function(){document.getElementById('pv').classList.toggle('hide')});
  draw();
  window.addEventListener('load',function(){var T=window.Telegram&&Telegram.WebApp;
    if(T&&T.platform&&T.platform!=='unknown'){var a=T.safeAreaInset||{},c=T.contentSafeAreaInset||{};
      document.documentElement.style.setProperty('--pulo-layout-inset-top',((a.top||0)+(c.top||0))+'px');
      document.documentElement.style.setProperty('--pulo-layout-inset-bottom',((a.bottom||0)+(c.bottom||0))+'px');}});
})();
</script>
