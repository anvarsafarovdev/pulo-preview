<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Pulo Preview</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="fonts/fonts.css?v=202611140048">
<link rel="stylesheet" href="kit.css?v=202611140048">
<style>
.hd{padding:var(--s5) var(--gut) var(--s2);}
.hd h1{margin:0;font-size:var(--t-5);font-weight:700;}
.hd p{margin:4px 0 0;font-size:var(--t-2);color:var(--text-2);}
.list{display:flex;flex-direction:column;padding:var(--s2) 0 var(--s7);}
.row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--gut);border:0;background:none;width:100%;
  text-align:left;color:var(--text-1);text-decoration:none;box-shadow:inset 0 -1px 0 var(--line);}
.row .tx{flex:1 1 auto;min-width:0;}
.row .t{display:block;font-size:var(--t-4);font-weight:700;line-height:1.3;}
.row .s{display:block;margin-top:2px;font-size:var(--t-2);color:var(--text-2);}
.row .w{display:block;margin-top:4px;font-size:var(--t-2);color:var(--text-3);}
.row .new{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--in);color:var(--ground);
  font-size:var(--t-1);font-weight:700;vertical-align:2px;}
.row svg{color:var(--text-3);}
.empty{padding:var(--s5) var(--gut);color:var(--text-2);font-size:var(--t-2);}
.ft{padding:0 var(--gut) var(--s6);font-size:var(--t-2);color:var(--text-3);}
</style>
</head>
<body data-home="1">
<div class="app">
  <div class="body">
    <header class="hd">
      <h1 class="cf">Pulo Preview</h1>
      <p>Designs to try before they are built. Newest first. Made-up people and amounts.</p>
    </header>
    <div class="list" id="list"><p class="empty">Loading…</p></div>
    <p class="ft" id="ft"></p>
  </div>
</div>
<script>
(function () {
  var list = document.getElementById('list');
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  fetch('designs.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
    var items = d.designs || [];
    if (!items.length) { list.innerHTML = '<p class="empty">Nothing to try yet.</p>'; return; }
    list.innerHTML = items.map(function (x, i) {
      return '<a class="row press" href="d/' + esc(x.file) + '?v=' + esc(x.stamp) + '">' +
        '<span class="tx"><span class="t cf">' + esc(x.title) + (i === 0 ? '<span class="new">NEW</span>' : '') + '</span>' +
        '<span class="s">' + esc(x.rev) + ' · ' + esc(x.when) + '</span>' +
        '<span class="w">' + esc(x.what) + '</span></span>' +
        '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>';
    }).join('');
    document.getElementById('ft').textContent = 'Site updated ' + (d.updated || '');
  }).catch(function () { list.innerHTML = '<p class="empty">Could not load the list. Pull down or reopen.</p>'; });
})();
</script>
<script src="tg.js?v=202611140048"></script>
</body>
</html>
